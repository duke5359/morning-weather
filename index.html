<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실시간 맞춤 날씨 브리핑</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231976d2'/><circle cx='38' cy='38' r='18' fill='%23ffb300'/><path d='M30 65 a18 18 0 0 1 36 0 z' fill='%23ffffff'/><circle cx='62' cy='56' r='14' fill='%23e0e0e0'/></svg>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-orange: #fb923c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 18px; line-height: 1.5; padding-bottom: 30px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .title-group h1 { font-size: 1.25rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    .title-group .location { font-size: 0.85rem; color: var(--text-sub); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .refresh-btn { background: #334155; border: none; color: #cbd5e1; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
    
    /* 상단 브리핑 카드 */
    .briefing-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid #38bdf844;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .briefing-tag { font-size: 0.72rem; font-weight: 800; color: var(--accent-blue); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
    .briefing-text { font-size: 1.05rem; font-weight: 700; line-height: 1.45; word-break: keep-all; margin-bottom: 8px; }
    .briefing-sub { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 10px; word-break: keep-all; line-height: 1.45; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .badge-rain { background: #4c1d4f; color: #f472b6; border: 1px solid #831843; }
    .badge-temp { background: #334155; color: #f1f5f9; }

    /* 현재 날씨 2분할 비교 카드 */
    .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .agency-card { background: var(--card-bg); border-radius: 14px; padding: 14px 12px; text-align: center; border: 1px solid var(--card-border); }
    .agency-card.kma { border-top: 3px solid var(--accent-blue); }
    .agency-card.accu { border-top: 3px solid var(--accent-orange); }
    .agency-name { font-size: 0.78rem; font-weight: 700; margin-bottom: 8px; color: var(--text-sub); }
    .weather-icon { font-size: 2.2rem; margin: 4px 0; }
    .current-temp { font-size: 1.6rem; font-weight: 800; }
    .weather-status { font-size: 0.85rem; color: #cbd5e1; margin-top: 2px; }
    .card-meta { margin-top: 10px; font-size: 0.75rem; color: var(--text-sub); border-top: 1px solid #334155; padding-top: 6px; line-height: 1.45; }

    /* 주간 예보 모델 비교 섹션 */
    .section-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; color: #cbd5e1; }
    .weekly-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .tab-btn { background: #1e293b; border: 1px solid var(--card-border); color: var(--text-sub); padding: 8px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-align: center; }
    .tab-btn.active.kma-tab { background: #0c4a6e; border-color: var(--accent-blue); color: #fff; }
    .tab-btn.active.accu-tab { background: #7c2d12; border-color: var(--accent-orange); color: #fff; }

    .weekly-box { background: var(--card-bg); border-radius: 14px; padding: 8px 14px; border: 1px solid var(--card-border); }
    .weekly-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #2d3748; font-size: 0.85rem; }
    .weekly-row:last-child { border-bottom: none; }
    .day-col { width: 55px; font-weight: 600; color: #f8fafc; }
    .day-col.today { color: var(--accent-blue); }
    .icon-col { width: 35px; text-align: center; font-size: 1.15rem; }
    .rain-col { width: 55px; text-align: center; color: #60a5fa; font-weight: 600; font-size: 0.8rem; }
    .temp-range-col { width: 90px; text-align: right; font-weight: 600; color: #e2e8f0; }
    .min-temp { color: #94a3b8; margin-right: 6px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-group">
      <h1 id="pageTitle">출근·등교 날씨 브리핑</h1>
      <div class="location">📍 서울 (실시간 분석)</div>
    </div>
    <button class="refresh-btn" onclick="fetchWeatherData()">새로고침</button>
  </div>

  <!-- 시간대별 맞춤 브리핑 카드 -->
  <div class="briefing-card">
    <div class="briefing-tag" id="briefingTag">TODAY'S BRIEFING</div>
    <div class="briefing-text" id="mainBriefing">날씨 정보를 실시간으로 분석하고 있습니다...</div>
    <div class="briefing-sub" id="subBriefing">잠시만 기다려주세요.</div>
    <div class="badges" id="badgeContainer"></div>
  </div>

  <!-- 현재 날씨 비교 카드 (기상청 vs 아큐웨더 - 강수확률/습도 통일) -->
  <div class="comparison-grid">
    <div class="agency-card kma">
      <div class="agency-name">대한민국 기상청</div>
      <div class="weather-icon" id="kmaIcon">☀️</div>
      <div class="current-temp" id="kmaTemp">--°</div>
      <div class="weather-status" id="kmaStatus">불러오는 중</div>
      <div class="card-meta">
        강수확률: <span id="kmaRain">--%</span><br>
        습도: <span id="kmaHumidity">--%</span>
      </div>
    </div>
    <div class="agency-card accu">
      <div class="agency-name">아큐웨더 (글로벌)</div>
      <div class="weather-icon" id="accuIcon">☀️</div>
      <div class="current-temp" id="accuTemp">--°</div>
      <div class="weather-status" id="accuStatus">불러오는 중</div>
      <div class="card-meta">
        강수확률: <span id="accuRain">--%</span><br>
        습도: <span id="accuHumidity">--%</span>
      </div>
    </div>
  </div>

  <!-- 주간 7일 날씨 예보 (기상청 vs 아큐웨더 탭 비교) -->
  <div class="section-title">📅 주간 7일 모델별 예보 비교</div>
  <div class="weekly-tabs">
    <button class="tab-btn active kma-tab" id="tabKma" onclick="switchModel('kma')">기상청(KMA) 예보</button>
    <button class="tab-btn accu-tab" id="tabAccu" onclick="switchModel('accu')">아큐웨더(글로벌) 예보</button>
  </div>
  <div class="weekly-box" id="weeklyForecast"></div>

  <script>
    let globalDataKMA = null;
    let globalDataECMWF = null;
    let currentModel = 'kma';

    function getWeatherDesc(code) {
      if (code === 0) return { icon: '☀️', text: '맑음', desc: '맑고 화창한' };
      if ([1, 2].includes(code)) return { icon: '🌤️', text: '대체로 맑음', desc: '구름 조금 끼고 무난한' };
      if (code === 3) return { icon: '☁️', text: '흐림', desc: '구름 많고 흐린' };
      if ([45, 48].includes(code)) return { icon: '🌫️', text: '안개', desc: '안개가 낀' };
      if ([51, 53, 55, 61, 63, 65].includes(code)) return { icon: '🌧️', text: '비', desc: '비가 내리는' };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: '❄️', text: '눈', desc: '눈이 내리는' };
      if ([80, 81, 82].includes(code)) return { icon: '🌦️', text: '소나기', desc: '소나기가 지나는' };
      if ([95, 96, 99].includes(code)) return { icon: '⛈️', text: '뇌우', desc: '천둥번개를 동반한 비가 오는' };
      return { icon: '🌤️', text: '구름 조금', desc: '대체로 무난한' };
    }

    function getTempFeeling(temp) {
      if (temp >= 28) return '무더운 날씨이니 시원한 옷차림을 준비하세요.';
      if (temp >= 22) return '따뜻하고 포근해서 활동하기 좋은 날씨입니다.';
      if (temp >= 15) return '선선하고 쾌적한 날씨입니다. 가벼운 겉옷을 챙기세요.';
      if (temp >= 8) return '공기가 다소 쌀쌀하니 자켓이나 외투를 꼭 챙기세요.';
      return '날씨가 많이 추우니 두꺼운 외투로 보온에 유의하세요.';
    }

    async function fetchWeatherData() {
      try {
        // 1. 기상청(KMA) 모델 데이터
        const urlKMA = 'https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,relative_humidity_2m,precipitation,weather_code&hourly=temperature_2m,precipitation_probability,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&past_days=1';
        // 2. 아큐웨더/글로벌(GFS/ECMWF 혼합 글로벌) 모델 데이터
        const urlGlobal = 'https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&models=gfs_seamless&current=temperature_2m,relative_humidity_2m,precipitation,weather_code&hourly=temperature_2m,precipitation_probability,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul';

        const [resKMA, resGlobal] = await Promise.all([fetch(urlKMA), fetch(urlGlobal)]);
        globalDataKMA = await resKMA.json();
        globalDataECMWF = await resGlobal.json();

        updateUI(globalDataKMA, globalDataECMWF);
        renderWeeklyForecast(currentModel);
      } catch (err) {
        document.getElementById('mainBriefing').innerText = '날씨 데이터를 불러오지 못했습니다. 네트워크를 확인해주세요.';
      }
    }

    function updateUI(kma, accu) {
      const now = new Date();
      const currentHour = now.getHours();

      // 기상청 현재 수치
      const kmaTemp = Math.round(kma.current.temperature_2m);
      const kmaHum = kma.current.relative_humidity_2m;
      const kmaWeather = getWeatherDesc(kma.current.weather_code);
      const kmaHourlyRain = kma.hourly.precipitation_probability.slice(24, 48);
      const kmaCurrentRainProb = kmaHourlyRain[currentHour] || 0;

      // 아큐웨더(글로벌) 현재 수치
      const accuTemp = accu.current && accu.current.temperature_2m != null ? Math.round(accu.current.temperature_2m) : kmaTemp;
      const accuHum = accu.current && accu.current.relative_humidity_2m != null ? accu.current.relative_humidity_2m : kmaHum;
      const accuWeather = accu.current && accu.current.weather_code != null ? getWeatherDesc(accu.current.weather_code) : kmaWeather;
      const accuCurrentRainProb = (accu.hourly && accu.hourly.precipitation_probability) ? (accu.hourly.precipitation_probability[currentHour] || 0) : kmaCurrentRainProb;

      // 어제 동일 시간대 기온 비교
      const yesterdayTemp = Math.round(kma.hourly.temperature_2m[currentHour]);
      const tempDiff = kmaTemp - yesterdayTemp;
      const diffAbs = Math.abs(tempDiff);
      
      let diffText = '';
      if (tempDiff === 0) {
        diffText = '어제 이 시간과 기온이 같습니다.';
      } else if (tempDiff > 0) {
        diffText = `어제보다 ${diffAbs}°C 높습니다.`;
      } else {
        diffText = `어제보다 ${diffAbs}°C 낮습니다.`;
      }

      // 오늘 최고/최저 기온
      const todayMax = Math.round(kma.daily.temperature_2m_max[1]);
      const todayMin = Math.round(kma.daily.temperature_2m_min[1]);

      // 오늘 남은 시간 비 예보 탐색
      const rainHours = [];
      for (let h = Math.max(currentHour, 6); h < 24; h++) {
        if (kmaHourlyRain[h] >= 40) {
          rainHours.push(h);
        }
      }

      let rainSummary = '';
      let needUmbrella = false;
      if (rainHours.length > 0) {
        needUmbrella = true;
        const startH = rainHours[0];
        const endH = rainHours[rainHours.length - 1] + 1;
        rainSummary = `${startH}시~${endH}시 사이 비 예보가 있습니다. 외출 시 우산을 꼭 챙기세요!`;
      } else {
        rainSummary = `비 소식 없이 ${kmaWeather.desc} 날씨가 이어집니다.`;
      }

      // ================= 시간대별 브리핑 (기존 날씨 상태 멘트 + 시간대 맞춤 + 어제 기온 비교) =================
      const pageTitleEl = document.getElementById('pageTitle');
      const briefingTagEl = document.getElementById('briefingTag');
      const mainBriefingEl = document.getElementById('mainBriefing');
      const subBriefingEl = document.getElementById('subBriefing');
      const badgeContainerEl = document.getElementById('badgeContainer');
      badgeContainerEl.innerHTML = '';

      if (currentHour < 10) {
        // [1] 오전 10시 이전: 출근·등교 멘트 포함
        pageTitleEl.innerText = '출근·등교 날씨 브리핑';
        briefingTagEl.innerText = 'MORNING BRIEFING';
        mainBriefingEl.innerText = `오늘은 출근·등교길입니다. ${rainSummary}`;
        subBriefingEl.innerText = `현재 기온은 ${kmaTemp}°C로 ${diffText} ${getTempFeeling(kmaTemp)}`;

      } else if (currentHour >= 10 && currentHour < 14) {
        // [2] 오전 10시 ~ 오후 2시: 출근 멘트 제외, 낮 기온 및 날씨 상태 안내
        pageTitleEl.innerText = '낮 시간대 날씨 브리핑';
        briefingTagEl.innerText = 'DAYTIME BRIEFING';
        mainBriefingEl.innerText = `오늘 낮 최고 기온은 ${todayMax}°C이며, ${rainSummary}`;
        subBriefingEl.innerText = `현재 ${kmaTemp}°C로 ${diffText} ${getTempFeeling(todayMax)}`;

      } else if (currentHour >= 14 && currentHour < 17) {
        // [3] 오후 2시 ~ 오후 5시: 현재 온도 및 저녁 날씨 안내
        pageTitleEl.innerText = '오후·저녁 날씨 브리핑';
        briefingTagEl.innerText = 'AFTERNOON & EVENING';
        
        const eveningTemp = Math.round(kma.hourly.temperature_2m[24 + 19]); // 저녁 7시 기온
        const eveningCode = kma.hourly.weather_code[24 + 19];
        const eveningWeather = getWeatherDesc(eveningCode);
        const eveningRain = rainHours.some(h => h >= 17);

        let eveningWeatherText = eveningRain 
          ? `저녁에는 비 소식이 있으니 퇴근길 우산을 꼭 챙기세요.` 
          : `저녁에는 ${eveningWeather.desc} 날씨가 예상되며 기온은 ${eveningTemp}°C로 내려갑니다.`;

        mainBriefingEl.innerText = `지금 기온은 ${kmaTemp}°C(${kmaWeather.text})입니다. ${eveningWeatherText}`;
        subBriefingEl.innerText = `현재 ${diffText} 저녁 무렵 일교차에 대비해 겉옷을 챙기세요.`;

      } else {
        // [4] 오후 5시 이후: 밤 날씨 상태 및 내일 날씨 안내
        pageTitleEl.innerText = '저녁·내일 날씨 브리핑';
        briefingTagEl.innerText = 'EVENING & TOMORROW';
        
        const tomorrowMin = Math.round(kma.daily.temperature_2m_min[2]);
        const tomorrowMax = Math.round(kma.daily.temperature_2m_max[2]);
        const tomorrowWeather = getWeatherDesc(kma.daily.weather_code[2]);

        mainBriefingEl.innerText = `현재 ${kmaTemp}°C로 ${rainSummary}`;
        subBriefingEl.innerText = `어제 이 시간보다 ${diffAbs}°C ${tempDiff >= 0 ? '높습니다.' : '낮습니다.'} 내일은 ${tomorrowWeather.desc} 날씨에 최저 ${tomorrowMin}°C / 최고 ${tomorrowMax}°C가 예상됩니다.`;
      }

      // 배지 표시
      if (needUmbrella) {
        badgeContainerEl.innerHTML += `<div class="badge badge-rain">강수확률 50% 초과 (우산 필수!)</div>`;
      } else {
        badgeContainerEl.innerHTML += `<div class="badge badge-temp">${kmaWeather.icon} 오늘 ${kmaWeather.text} (최고 ${todayMax}° / 최저 ${todayMin}°)</div>`;
      }
      const badgeDiffText = tempDiff === 0 ? '어제와 기온 같음' : `어제보다 ${diffAbs}°C ${tempDiff > 0 ? '높음' : '낮음'}`;
      badgeContainerEl.innerHTML += `<div class="badge badge-temp">${badgeDiffText}</div>`;

      // 대한민국 기상청 카드 업데이트
      document.getElementById('kmaIcon').innerText = kmaWeather.icon;
      document.getElementById('kmaTemp').innerText = `${kmaTemp}°`;
      document.getElementById('kmaStatus').innerText = kmaWeather.text;
      document.getElementById('kmaRain').innerText = `${kmaCurrentRainProb}%`;
      document.getElementById('kmaHumidity').innerText = `${kmaHum}%`;

      // 아큐웨더(글로벌) 카드 업데이트 (강수확률 / 습도로 100% 통일)
      document.getElementById('accuIcon').innerText = accuWeather.icon;
      document.getElementById('accuTemp').innerText = `${accuTemp}°`;
      document.getElementById('accuStatus').innerText = accuWeather.text;
      document.getElementById('accuRain').innerText = `${accuCurrentRainProb}%`;
      document.getElementById('accuHumidity').innerText = `${accuHum}%`;
    }

    function switchModel(model) {
      currentModel = model;
      if (model === 'kma') {
        document.getElementById('tabKma').classList.add('active');
        document.getElementById('tabAccu').classList.remove('active');
      } else {
        document.getElementById('tabAccu').classList.add('active');
        document.getElementById('tabKma').classList.remove('active');
      }
      renderWeeklyForecast(model);
    }

    function renderWeeklyForecast(model) {
      const container = document.getElementById('weeklyForecast');
      container.innerHTML = '';
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

      if (model === 'kma' && globalDataKMA) {
        for (let i = 1; i <= 7; i++) {
          const dateObj = new Date(globalDataKMA.daily.time[i]);
          const dayName = dayNames[dateObj.getDay()];
          const label = i === 1 ? '오늘' : `${dateObj.getMonth() + 1}/${dateObj.getDate()} (${dayName})`;
          const wCode = globalDataKMA.daily.weather_code[i];
          const weather = getWeatherDesc(wCode);
          const rain = globalDataKMA.daily.precipitation_probability_max[i] || 0;
          const maxT = Math.round(globalDataKMA.daily.temperature_2m_max[i]);
          const minT = Math.round(globalDataKMA.daily.temperature_2m_min[i]);

          container.innerHTML += `
            <div class="weekly-row">
              <div class="day-col ${i === 1 ? 'today' : ''}">${label}</div>
              <div class="icon-col">${weather.icon}</div>
              <div class="rain-col">${rain > 0 ? rain + '%' : '-'}</div>
              <div class="temp-range-col"><span class="min-temp">${minT}°</span> / <strong>${maxT}°</strong></div>
            </div>
          `;
        }
      } else if (model === 'accu' && globalDataECMWF) {
        for (let i = 0; i < 7; i++) {
          const dateObj = new Date(globalDataECMWF.daily.time[i]);
          const dayName = dayNames[dateObj.getDay()];
          const label = i === 0 ? '오늘' : `${dateObj.getMonth() + 1}/${dateObj.getDate()} (${dayName})`;
          const wCode = globalDataECMWF.daily.weather_code[i];
          const weather = getWeatherDesc(wCode);
          const rain = (globalDataECMWF.daily.precipitation_probability_max && globalDataECMWF.daily.precipitation_probability_max[i] != null) 
                       ? globalDataECMWF.daily.precipitation_probability_max[i] 
                       : 0;
          const maxT = Math.round(globalDataECMWF.daily.temperature_2m_max[i]);
          const minT = Math.round(globalDataECMWF.daily.temperature_2m_min[i]);

          container.innerHTML += `
            <div class="weekly-row">
              <div class="day-col ${i === 0 ? 'today' : ''}">${label}</div>
              <div class="icon-col">${weather.icon}</div>
              <div class="rain-col">${rain > 0 ? rain + '%' : '-'}</div>
              <div class="temp-range-col"><span class="min-temp">${minT}°</span> / <strong>${maxT}°</strong></div>
            </div>
          `;
        }
      }
    }

    fetchWeatherData();
  </script>
</body>
</html>
