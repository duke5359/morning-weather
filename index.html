<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>출근·등교 날씨 브리핑</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="출근등교날씨">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.07);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --kma-color: #38bdf8;
      --accu-color: #fb923c;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; }
    body {
      background: linear-gradient(180deg, #090d16 0%, #1e293b 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 16px 60px;
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header-left h1 { font-size: 20px; font-weight: 800; color: #ffffff; }
    .loc-badge { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
    .btn-refresh {
      background: var(--card-bg); border: 1px solid var(--card-border); color: #fff;
      padding: 7px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    }

    /* 알림 & 타이머 컨트롤 박스 */
    .timer-card {
      background: rgba(30, 41, 59, 0.6); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 14px 16px; margin-bottom: 20px;
    }
    .timer-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .timer-row { display: flex; gap: 8px; align-items: center; }
    .time-picker {
      background: #0f172a; border: 1px solid var(--card-border); color: #fff;
      padding: 8px 10px; border-radius: 8px; font-size: 14px; font-weight: 700; outline: none;
    }
    .btn-action {
      flex: 1; background: #334155; border: 1px solid var(--card-border); color: #fff;
      font-size: 13px; font-weight: 700; padding: 9px 8px; border-radius: 8px; cursor: pointer; text-align: center;
    }
    .btn-action.active { background: #0284c7; border-color: #38bdf8; }

    /* 두 관측기관 비교 섹션 */
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .agency-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 16px 12px; text-align: center;
      position: relative;
    }
    .agency-card.kma { border-top: 4px solid var(--kma-color); }
    .agency-card.accu { border-top: 4px solid var(--accu-color); }

    .agency-name { font-size: 13px; font-weight: 800; margin-bottom: 6px; }
    .agency-card.kma .agency-name { color: var(--kma-color); }
    .agency-card.accu .agency-name { color: var(--accu-color); }

    .weather-icon { font-size: 38px; margin: 4px 0; }
    .temp-main { font-size: 32px; font-weight: 900; line-height: 1.1; margin-bottom: 4px; }
    .weather-desc { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: #e2e8f0; }

    .stat-box { background: rgba(0,0,0,0.25); border-radius: 8px; padding: 8px 4px; }
    .stat-row { display: flex; justify-content: space-around; font-size: 12px; }
    .stat-label { color: var(--text-muted); }
    .stat-val { font-weight: 700; }
    .rain-highlight { color: #38bdf8; font-weight: 800; }

    /* 종합 브리핑 판정 카드 */
    .summary-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 14px 16px; margin-bottom: 20px;
    }
    .summary-head { font-size: 14px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .summary-text { font-size: 13px; color: #cbd5e1; line-height: 1.5; }

    /* 출근/등교 시간대별 예보 */
    .section-title { font-size: 15px; font-weight: 700; color: var(--text-muted); margin-bottom: 10px; }
    .commute-list { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 8px 14px; }
    .commute-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .commute-item:last-child { border-bottom: none; }
    .commute-time { font-size: 14px; font-weight: 700; }
    .commute-compare { display: flex; gap: 14px; font-size: 13px; font-weight: 600; }
    .c-kma { color: var(--kma-color); }
    .c-accu { color: var(--accu-color); }

    .loading-box { text-align: center; padding: 50px 0; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>출근·등교 날씨 브리핑</h1>
      <div class="loc-badge" id="locDisplay">📍 위치 확인 중...</div>
    </div>
    <button class="btn-refresh" onclick="fetchAllWeather()">새로고침</button>
  </header>

  <!-- 모닝 알리미 설정 -->
  <div class="timer-card">
    <div class="timer-title">
      <span>⏰ 모닝 날씨 알리미 설정</span>
      <span id="timerStatus" style="font-size:12px; color:var(--text-muted);">미설정</span>
    </div>
    <div class="timer-row">
      <input type="time" id="alertTime" class="time-picker" value="08:00">
      <button class="btn-action active" onclick="registerDailyCalendar()">매일 반복 알림 심기</button>
      <button class="btn-action" id="inAppBtn" onclick="toggleInAppTimer()">앱 타이머</button>
    </div>
  </div>

  <div id="contentWrapper">
    <div class="loading-box">기상청 및 글로벌 관측 데이터를 동시 수신 중입니다...</div>
  </div>

  <script>
    let timerInterval = null;

    function parseWeather(code) {
      if (code === 0) return { desc: '맑음', icon: '☀️' };
      if (code === 1 || code === 2) return { desc: '구름조금', icon: '🌤️' };
      if (code === 3) return { desc: '흐림', icon: '☁️' };
      if (code >= 51 && code <= 55) return { desc: '이슬비', icon: '🌦️' };
      if (code >= 61 && code <= 65) return { desc: '비', icon: '🌧️' };
      if (code >= 71 && code <= 75) return { desc: '눈', icon: '❄️' };
      if (code >= 80 && code <= 82) return { desc: '소나기', icon: '🌦️' };
      if (code >= 95) return { desc: '뇌우', icon: '⛈️' };
      return { desc: '흐림', icon: '☁️' };
    }

    function init() {
      fetchAllWeather();
    }

    function fetchAllWeather() {
      document.getElementById('contentWrapper').innerHTML = '<div class="loading-box">기상청 및 글로벌 관측 데이터를 동시 수신 중입니다...</div>';

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => loadData(pos.coords.latitude, pos.coords.longitude, '현재 위치'),
          () => loadData(37.5665, 126.9780, '서울 기본'),
          { timeout: 7000 }
        );
      } else {
        loadData(37.5665, 126.9780, '서울 기본');
      }
    }

    async function loadData(lat, lon, label) {
      document.getElementById('locDisplay').innerText = `📍 ${label}`;

      const urlKMA = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability&models=kma_seamless&timezone=auto`;
      const urlGlobal = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability&models=ecmwf_ifs025&timezone=auto`;

      try {
        const [resKma, resGlobal] = await Promise.all([
          fetch(urlKMA).then(r => r.json()),
          fetch(urlGlobal).then(r => r.json())
        ]);

        renderComparison(resKma, resGlobal);
      } catch (e) {
        document.getElementById('contentWrapper').innerHTML = '<div class="loading-box">기상 데이터를 가져오지 못했습니다. 새로고침을 눌러주세요.</div>';
      }
    }

    function renderComparison(kma, global) {
      const curKma = kma.current;
      const curAccu = global.current;

      const infoKma = parseWeather(curKma.weather_code);
      const infoAccu = parseWeather(curAccu.weather_code);

      const curHour = new Date().getHours();
      const kmaProb = kma.hourly.precipitation_probability ? (kma.hourly.precipitation_probability[curHour] || 0) : 0;
      const accuProb = global.hourly.precipitation_probability ? (global.hourly.precipitation_probability[curHour] || 0) : 0;

      // [핵심 변경] 강수확률 50% 초과(51% 이상)이거나 실제 비/눈/소나기 예보일 때만 우산 경고 발생
      const isRainCode = (code) => (code >= 51 && code <= 65) || (code >= 80 && code <= 82) || code >= 95;
      const umbrellaNeeded = (kmaProb > 50) || (accuProb > 50) || isRainCode(curKma.weather_code) || isRainCode(curAccu.weather_code);

      let summaryMsg = '';
      if (umbrellaNeeded) {
        summaryMsg = '☔ <strong>우산 챙기세요!</strong> 관측 기관 중 강수확률 50% 초과 또는 직접적인 강수 예보가 있습니다.';
      } else {
        summaryMsg = '☀️ <strong>비 걱정 없는 아침입니다. (우산 불필요)</strong> 두 기관 모두 강수확률이 50% 이하이며 안정적입니다.';
      }

      const tempDiff = Math.abs(Math.round(curKma.temperature_2m) - Math.round(curAccu.temperature_2m));
      if (tempDiff >= 2) {
        summaryMsg += `<br>※ 기온 오차가 ${tempDiff}°C 있습니다. 체감 온도를 확인해 옷차림을 챙기세요.`;
      }

      // 출퇴근 및 등하교 주요 시간대 (07시 ~ 19시)
      const hoursToShow = [7, 8, 9, 12, 18];
      let commuteHtml = '';

      hoursToShow.forEach(h => {
        const kTemp = Math.round(kma.hourly.temperature_2m[h] || 0);
        const aTemp = Math.round(global.hourly.temperature_2m[h] || 0);
        const kProb = kma.hourly.precipitation_probability ? (kma.hourly.precipitation_probability[h] || 0) : 0;
        const aProb = global.hourly.precipitation_probability ? (global.hourly.precipitation_probability[h] || 0) : 0;

        commuteHtml += `
          <div class="commute-item">
            <span class="commute-time">${String(h).padStart(2, '0')}:00</span>
            <div class="commute-compare">
              <span class="c-kma">기상청 ${kTemp}° (${kProb}%)</span>
              <span class="c-accu">아큐웨더 ${aTemp}° (${aProb}%)</span>
            </div>
          </div>
        `;
      });

      const html = `
        <div class="summary-card">
          <div class="summary-head">📋 오늘 아침 출근·등교 요약</div>
          <div class="summary-text">${summaryMsg}</div>
        </div>

        <div class="compare-grid">
          <!-- 대한민국 기상청 -->
          <div class="agency-card kma">
            <div class="agency-name">대한민국 기상청</div>
            <div class="weather-icon">${infoKma.icon}</div>
            <div class="temp-main">${Math.round(curKma.temperature_2m)}°</div>
            <div class="weather-desc">${infoKma.desc}</div>
            <div class="stat-box">
              <div class="stat-row">
                <span class="stat-label">강수확률</span>
                <span class="stat-val rain-highlight">${kmaProb}%</span>
              </div>
              <div class="stat-row" style="margin-top:4px;">
                <span class="stat-label">체감/습도</span>
                <span class="stat-val">${Math.round(curKma.apparent_temperature)}° / ${curKma.relative_humidity_2m}%</span>
              </div>
            </div>
          </div>

          <!-- 아큐웨더(글로벌) -->
          <div class="agency-card accu">
            <div class="agency-name">아큐웨더(글로벌)</div>
            <div class="weather-icon">${infoAccu.icon}</div>
            <div class="temp-main">${Math.round(curAccu.temperature_2m)}°</div>
            <div class="weather-desc">${infoAccu.desc}</div>
            <div class="stat-box">
              <div class="stat-row">
                <span class="stat-label">강수확률</span>
                <span class="stat-val rain-highlight">${accuProb}%</span>
              </div>
              <div class="stat-row" style="margin-top:4px;">
                <span class="stat-label">체감/습도</span>
                <span class="stat-val">${Math.round(curAccu.apparent_temperature)}° / ${curAccu.relative_humidity_2m}%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="section-title">출근·등교 및 주요 시간대 예보</div>
        <div class="commute-list">
          ${commuteHtml}
        </div>
      `;

      document.getElementById('contentWrapper').innerHTML = html;
    }

    function registerDailyCalendar() {
      const timeVal = document.getElementById('alertTime').value || '08:00';
      const [hours, mins] = timeVal.split(':');

      const now = new Date();
      now.setHours(parseInt(hours, 10), parseInt(mins, 10), 0, 0);

      const formatIcsTime = (d) => d.toISOString().replace(/-|:|\.\d+/g, '');
      const start = formatIcsTime(now);
      const end = formatIcsTime(new Date(now.getTime() + 15 * 60 * 1000));

      const ics = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Morning Weather Manager//KO',
        'BEGIN:VEVENT',
        'SUMMARY:출근·등교 날씨 브리핑 (기상청 vs 아큐웨더)',
        'DESCRIPTION:오늘의 기온 차이와 50% 초과 비 예보 여부를 확인하세요.',
        `DTSTART:${start}`,
        `DTEND:${end}`,
        'RRULE:FREQ=DAILY',
        'BEGIN:VALARM',
        'TRIGGER:-PT0M',
        'ACTION:DISPLAY',
        'DESCRIPTION:출근/등교 전 날씨 확인 시간입니다!',
        'END:VALARM',
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', '매일아침_날씨알림.ics');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      alert(`매일 아침 [${timeVal}] 시스템 알람 파일이 생성되었습니다. 캘린더에 추가해 주세요.`);
    }

    function toggleInAppTimer() {
      const btn = document.getElementById('inAppBtn');
      const status = document.getElementById('timerStatus');

      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.innerText = '앱 타이머';
        btn.classList.remove('active');
        status.innerText = '타이머 해제됨';
        return;
      }

      const timeVal = document.getElementById('alertTime').value || '08:00';
      const [h, m] = timeVal.split(':').map(Number);

      const target = new Date();
      target.setHours(h, m, 0, 0);
      if (target <= new Date()) {
        target.setDate(target.getDate() + 1);
      }

      btn.innerText = '타이머 중지';
      btn.classList.add('active');

      timerInterval = setInterval(() => {
        const diff = target - new Date();
        if (diff <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          btn.innerText = '앱 타이머';
          btn.classList.remove('active');
          status.innerText = '알림 울림!';
          playAlarmSound();
          alert(`[${timeVal}] 출근/등교 시간입니다! 오늘의 날씨를 확인하세요.`);
        } else {
          const totalSec = Math.floor(diff / 1000);
          const hrs = Math.floor(totalSec / 3600);
          const mins = Math.floor((totalSec % 3600) / 60);
          const secs = totalSec % 60;
          status.innerText = `${hrs}시간 ${mins}분 ${secs}초 남음`;
        }
      }, 1000);
    }

    function playAlarmSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 1.2);
      } catch (e) {}
    }

    window.onload = init;
  </script>
</body>
</html>
