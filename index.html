<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>실시간 맞춤 날씨 브리핑</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231976d2'/><circle cx='38' cy='38' r='18' fill='%23ffb300'/><path d='M30 65 a18 18 0 0 1 36 0 z' fill='%23ffffff'/><circle cx='62' cy='56' r='14' fill='%23e0e0e0'/></svg>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-orange: #fb923c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; }
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      padding: calc(env(safe-area-inset-top, 20px) + 14px) 18px 34px 18px; 
      line-height: 1.5; 
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .title-group h1 { font-size: 1.25rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    .title-group .location { font-size: 0.85rem; color: var(--text-sub); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .refresh-btn { background: #334155; border: none; color: #cbd5e1; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
    
    /* 상단 브리핑 카드 */
    .briefing-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid #38bdf844;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .briefing-tag { font-size: 0.72rem; font-weight: 800; color: var(--accent-blue); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
    .briefing-text { font-size: 1.05rem; font-weight: 700; line-height: 1.45; word-break: keep-all; margin-bottom: 8px; }
    .briefing-sub { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 12px; word-break: keep-all; line-height: 1.45; }
    
    /* 일과 시간 vs 일과 이후 요약 미니 박스 */
    .schedule-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: #0f172a99;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      font-size: 0.8rem;
    }
    .sched-item { display: flex; flex-direction: column; gap: 2px; }
    .sched-item:first-child { border-right: 1px solid #334155; padding-right: 8px; }
    .sched-item:last-child { padding-left: 4px; }
    .sched-label { color: var(--text-sub); font-size: 0.72rem; font-weight: 700; }
    .sched-val { color: #f8fafc; font-weight: 700; font-size: 0.85rem; }
    .sched-desc { color: #93c5fd; font-size: 0.75rem; }

    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .badge-rain { background: #4c1d4f; color: #f472b6; border: 1px solid #831843; }
    .badge-safe { background: #064e3b; color: #6ee7b7; border: 1px solid #047857; }
    .badge-temp { background: #334155; color: #f1f5f9; }

    /* 현재 날씨 2분할 비교 카드 */
    .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .agency-card { background: var(--card-bg); border-radius: 14px; padding: 14px 12px; text-align: center; border: 1px solid var(--card-border); }
    .agency-card.kma { border-top: 3px solid var(--accent-blue); }
    .agency-card.accu { border-top: 3px solid var(--accent-orange); }
    .agency-name { font-size: 0.78rem; font-weight: 700; margin-bottom: 8px; color: var(--text-sub); }
    .weather-icon { font-size: 2.2rem; margin: 4px 0; }
    .current-temp { font-size: 1.6rem; font-weight: 800; }
    .weather-status { font-size: 0.85rem; color: #cbd5e1; margin-top: 2px; }
    .card-meta { margin-top: 10px; font-size: 0.75rem; color: var(--text-sub); border-top: 1px solid #334155; padding-top: 6px; line-height: 1.45; }

    /* 주간 예보 모델 비교 섹션 */
    .section-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; color: #cbd5e1; }
    .weekly-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .tab-btn { background: #1e293b; border: 1px solid var(--card-border); color: var(--text-sub); padding: 8px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer; text-align: center; }
    .tab-btn.active.kma-tab { background: #0c4a6e; border-color: var(--accent-blue); color: #fff; }
    .tab-btn.active.accu-tab { background: #7c2d12; border-color: var(--accent-orange); color: #fff; }

    .weekly-box { background: var(--card-bg); border-radius: 14px; padding: 8px 14px; border: 1px solid var(--card-border); }
    .weekly-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #2d3748; font-size: 0.85rem; }
    .weekly-row:last-child { border-bottom: none; }
    .day-col { width: 65px; font-weight: 600; color: #f8fafc; }
    .day-col.today { color: var(--accent-blue); }
    .icon-col { width: 35px; text-align: center; font-size: 1.15rem; }
    .rain-col { width: 55px; text-align: center; color: #60a5fa; font-weight: 600; font-size: 0.8rem; }
    .temp-range-col { width: 90px; text-align: right; font-weight: 600; color: #e2e8f0; }
    .min-temp { color: #94a3b8; margin-right: 4px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-group">
      <h1 id="pageTitle">출근·등교 날씨 브리핑</h1>
      <div class="location">📍 서울 (기상청·글로벌 실시간 비교)</div>
    </div>
    <button class="refresh-btn" onclick="fetchWeatherData()">새로고침</button>
  </div>

  <!-- 시간대별 맞춤 브리핑 + 일과시간/일과이후 분석 카드 -->
  <div class="briefing-card">
    <div class="briefing-tag" id="briefingTag">TODAY'S BRIEFING</div>
    <div class="briefing-text" id="mainBriefing">날씨 정보를 실시간으로 분석하고 있습니다...</div>
    <div class="briefing-sub" id="subBriefing">잠시만 기다려주세요.</div>
    
    <!-- 일과 시간 vs 일과 이후 구분 요약 -->
    <div class="schedule-summary">
      <div class="sched-item">
        <span class="sched-label">☀️ 일과 시간 (08~18시)</span>
        <span class="sched-val" id="workTempInfo">--° ~ --°</span>
        <span class="sched-desc" id="workRainInfo">분석 중...</span>
      </div>
      <div class="sched-item">
        <span class="sched-label">🌙 일과 이후 (18~24시)</span>
        <span class="sched-val" id="afterTempInfo">--° (일과 대비 --°)</span>
        <span class="sched-desc" id="afterRainInfo">분석 중...</span>
      </div>
    </div>

    <div class="badges" id="badgeContainer"></div>
  </div>

  <!-- 현재 날씨 2분할 비교 카드 (기상청 vs 아큐웨더 - 강수확률/습도 통일) -->
  <div class="comparison-grid">
    <div class="agency-card kma">
      <div class="agency-name">대한민국 기상청</div>
      <div class="weather-icon" id="kmaIcon">☀️</div>
      <div class="current-temp" id="kmaTemp">--°</div>
      <div class="weather-status" id="kmaStatus">불러오는 중</div>
      <div class="card-meta">
        강수확률: <span id="kmaRain">--%</span><br>
        습도: <span id="kmaHumidity">--%</span>
      </div>
    </div>
    <div class="agency-card accu">
      <div class="agency-name">아큐웨더 (글로벌)</div>
      <div class="weather-icon" id="accuIcon">☀️</div>
      <div class="current-temp" id="accuTemp">--°</div>
      <div class="weather-status" id="accuStatus">불러오는 중</div>
      <div class="card-meta">
        강수확률: <span id="accuRain">--%</span><br>
        습도: <span id="accuHumidity">--%</span>
      </div>
    </div>
  </div>

  <!-- 주간 7일 날씨 예보 -->
  <div class="section-title">📅 주간 7일 모델별 예보 비교</div>
  <div class="weekly-tabs">
    <button class="tab-btn active kma-tab" id="tabKma" onclick="switchModel('kma')">기상청(KMA) 예보</button>
    <button class="tab-btn accu-tab" id="tabAccu" onclick="switchModel('accu')">아큐웨더(글로벌) 예보</button>
  </div>
  <div class="weekly-box" id="weeklyForecast"></div>

  <script>
    let globalDataKMA = null;
    let globalDataBase = null;
    let globalDataAccu = null;
    let currentModel = 'kma';

    function getWeatherDesc(code, rainProb = null) {
      if (rainProb !== null && rainProb < 30 && [51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) {
        return { icon: '🌤️', text: '구름 조금', desc: '구름 조금 끼고 무난한' };
      }
      if (code === 0) return { icon: '☀️', text: '맑음', desc: '맑고 화창한' };
      if ([1, 2].includes(code)) return { icon: '🌤️', text: '대체로 맑음', desc: '구름 조금 끼고 포근한' };
      if (code === 3) return { icon: '☁️', text: '흐림', desc: '구름 많고 흐린' };
      if ([45, 48].includes(code)) return { icon: '🌫️', text: '안개', desc: '안개가 낀' };
      if ([51, 53, 55, 61, 63, 65].includes(code)) return { icon: '🌧️', text: '비', desc: '비가 내리는' };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: '❄️', text: '눈', desc: '눈이 내리는' };
      if ([80, 81, 82].includes(code)) return { icon: '🌦️', text: '소나기', desc: '소나기가 지나는' };
      if ([95, 96, 99].includes(code)) return { icon: '⛈️', text: '뇌우', desc: '천둥번개를 동반한 비가 오는' };
      return { icon: '🌤️', text: '구름 조금', desc: '대체로 무난한' };
    }

    function roundRainProb(prob) {
      if (!prob || prob < 10) return 0;
      return Math.round(prob / 10) * 10;
    }

    async function fetchWeatherData() {
      try {
        const urlKMA = '[https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&models=kma_seamless&current=temperature_2m,relative_humidity_2m,precipitation,weather_code&hourly=temperature_2m,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&past_days=1](https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&models=kma_seamless&current=temperature_2m,relative_humidity_2m,precipitation,weather_code&hourly=temperature_2m,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&past_days=1)';
        const urlBase = '[https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&hourly=precipitation_probability&daily=precipitation_probability_max&timezone=Asia%2FSeoul&past_days=1](https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&hourly=precipitation_probability&daily=precipitation_probability_max&timezone=Asia%2FSeoul&past_days=1)';
        const urlAccu = '[https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&models=gfs_seamless&current=temperature_2m,relative_humidity_2m,precipitation,weather_code&hourly=temperature_2m,precipitation_probability,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul](https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&models=gfs_seamless&current=temperature_2m,relative_humidity_2m,precipitation,weather_code&hourly=temperature_2m,precipitation_probability,relative_humidity_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul)';

        const [resKMA, resBase, resAccu] = await Promise.all([fetch(urlKMA), fetch(urlBase), fetch(urlAccu)]);
        globalDataKMA = await resKMA.json();
        globalDataBase = await resBase.json();
        globalDataAccu = await resAccu.json();

        updateUI(globalDataKMA, globalDataBase, globalDataAccu);
        renderWeeklyForecast(currentModel);
      } catch (err) {
        document.getElementById('mainBriefing').innerText = '날씨 데이터를 불러오지 못했습니다. 네트워크를 확인해주세요.';
      }
    }

    function updateUI(kma, base, accu) {
      const now = new Date();
      const currentHour = now.getHours();

      // 오늘 00시~23시 데이터 배열 (past_days=1 이므로 24~47 인덱스)
      const todayTemps = kma.hourly.temperature_2m.slice(24, 48).map(t => Math.round(t));
      const todayRains = base.hourly.precipitation_probability.slice(24, 48);
      const todayCodes = kma.hourly.weather_code.slice(24, 48);

      // 현재 수치
      const kmaTemp = Math.round(kma.current.temperature_2m);
      const kmaHum = kma.current.relative_humidity_2m;
      const kmaCurrentRainProb = roundRainProb(todayRains[currentHour] || 0);
      const kmaWeather = getWeatherDesc(kma.current.weather_code, kmaCurrentRainProb);

      const accuTemp = accu.current && accu.current.temperature_2m != null ? Math.round(accu.current.temperature_2m) : kmaTemp;
      const accuHum = accu.current && accu.current.relative_humidity_2m != null ? accu.current.relative_humidity_2m : kmaHum;
      const accuCurrentRainProb = (accu.hourly && accu.hourly.precipitation_probability) ? (accu.hourly.precipitation_probability[currentHour] || 0) : kmaCurrentRainProb;
      const accuWeather = accu.current && accu.current.weather_code != null ? getWeatherDesc(accu.current.weather_code, accuCurrentRainProb) : kmaWeather;

      // 1. 어제 동시간대 기온 비교
      const yesterdayTemp = Math.round(kma.hourly.temperature_2m[currentHour]);
      const tempDiff = kmaTemp - yesterdayTemp;
      const diffAbs = Math.abs(tempDiff);
      const diffText = tempDiff === 0 ? '어제 이 시간과 기온이 같습니다.' : `어제보다 ${diffAbs}°C ${tempDiff > 0 ? '높습니다' : '낮습니다'}.`;

      // 2. 일과 시간(08~18시) vs 일과 이후(18~24시) 정밀 분리 분석
      const workTemps = todayTemps.slice(8, 18);
      const afterTemps = todayTemps.slice(18, 24);
      const workMin = Math.min(...workTemps);
      const workMax = Math.max(...workTemps);
      const afterMin = Math.min(...afterTemps);
      const afterAvg = Math.round(afterTemps.reduce((a, b) => a + b, 0) / afterTemps.length);
      const dayNightGap = workMax - afterMin; // 낮 최고와 일과 이후 최저 기온 차

      const workRainHours = [];
      const afterRainHours = [];
      for (let h = 8; h < 18; h++) { if (todayRains[h] >= 40) workRainHours.push(h); }
      for (let h = 18; h < 24; h++) { if (todayRains[h] >= 40) afterRainHours.push(h); }

      // 미니 요약 박스 업데이트
      document.getElementById('workTempInfo').innerText = `${workMin}° ~ ${workMax}°`;
      document.getElementById('workRainInfo').innerText = workRainHours.length > 0 ? `☔ ${workRainHours[0]}시~${workRainHours[workRainHours.length-1]+1}시 비 예보` : '☀️ 비 소식 없음 (활동 쾌적)';
      document.getElementById('afterTempInfo').innerText = `${afterMin}°~${afterTemps[0]}° (낮보다 ${dayNightGap}°↓)`;
      document.getElementById('afterRainInfo').innerText = afterRainHours.length > 0 ? `☔ ${afterRainHours[0]}시 이후 비 예보` : '🌙 비 소식 없이 선선함';

      // 일과 시간 vs 일과 이후 강수 종합 멘트 생성
      let rainAnalysisText = '';
      if (workRainHours.length > 0 && afterRainHours.length > 0) {
        rainAnalysisText = `일과 시간(${workRainHours[0]}시~)부터 일과 이후 밤까지 비 예보가 이어지니 우산을 꼭 챙기세요!`;
      } else if (workRainHours.length > 0 && afterRainHours.length === 0) {
        rainAnalysisText = `일과 시간(${workRainHours[0]}시~${workRainHours[workRainHours.length-1]+1}시)에 비가 내리지만, 일과 이후 퇴근길엔 그치겠습니다.`;
      } else if (workRainHours.length === 0 && afterRainHours.length > 0) {
        rainAnalysisText = `일과 시간에는 ${kmaWeather.desc} 날씨이나, 일과 이후(${afterRainHours[0]}시~) 비 예보가 있으니 늦은 귀가 시 우산을 챙기세요.`;
      } else {
        rainAnalysisText = `일과 시간과 일과 이후 모두 비 예보 없이 ${kmaWeather.desc} 날씨가 이어집니다.`;
      }

      // 3. 시간대별(10시전 / 10~14시 / 14~17시 / 17시후) 맞춤 브리핑 적용
      const pageTitleEl = document.getElementById('pageTitle');
      const briefingTagEl = document.getElementById('briefingTag');
      const mainBriefingEl = document.getElementById('mainBriefing');
      const subBriefingEl = document.getElementById('subBriefing');
      const badgeContainerEl = document.getElementById('badgeContainer');
      badgeContainerEl.innerHTML = '';

      if (currentHour < 10) {
        // [오전 10시 이전] 출근·등교 멘트 포함
        pageTitleEl.innerText = '출근·등교 날씨 브리핑';
        briefingTagEl.innerText = 'MORNING BRIEFING';
        mainBriefingEl.innerText = `오늘은 출근·등교길입니다. ${rainAnalysisText}`;
        subBriefingEl.innerText = `현재 ${kmaTemp}°C로 ${diffText} 일과 시간엔 최고 ${workMax}°C까지 오르고, 일과 이후 저녁엔 ${afterMin}°C까지 내려가 기온 차가 ${dayNightGap}°C 나니 겉옷을 챙기세요.`;

      } else if (currentHour >= 10 && currentHour < 14) {
        // [오전 10시 ~ 오후 2시] 출근 멘트 제외, 낮 온도 안내
        pageTitleEl.innerText = '낮 시간대 날씨 브리핑';
        briefingTagEl.innerText = 'DAYTIME BRIEFING';
        mainBriefingEl.innerText = `오늘 낮(일과 시간) 최고 기온은 ${workMax}°C이며, ${rainAnalysisText}`;
        subBriefingEl.innerText = `현재 ${kmaTemp}°C로 ${diffText} 일과 이후(18시~)에는 기온이 ${afterMin}°C까지 떨어져 낮과 기온 차가 ${dayNightGap}°C 벌어집니다.`;

      } else if (currentHour >= 14 && currentHour < 17) {
        // [오후 2시 ~ 오후 5시] 현재 온도 및 저녁(일과 이후) 날씨 집중 안내
        pageTitleEl.innerText = '오후·저녁 날씨 브리핑';
        briefingTagEl.innerText = 'AFTERNOON & EVENING';
        const afterWeather = getWeatherDesc(todayCodes[19], todayRains[19]);
        mainBriefingEl.innerText = `지금 기온은 ${kmaTemp}°C(${kmaWeather.text})이며, 일과 이후 저녁엔 ${afterWeather.desc} 날씨와 함께 ${afterMin}°C로 내려갑니다.`;
        subBriefingEl.innerText = `현재 ${diffText} ${afterRainHours.length > 0 ? '일과 이후 저녁 시간대 비 소식이 있으니 우산을 준비하세요.' : `일과 시간 대비 저녁 기온이 ${dayNightGap}°C가량 뚝 떨어지니 퇴근길 보온에 유의하세요.`}`;

      } else {
        // [오후 5시 이후] 일과 이후 밤 날씨 & 내일 예고
        pageTitleEl.innerText = '저녁·내일 날씨 브리핑';
        briefingTagEl.innerText = 'EVENING & TOMORROW';
        const tomorrowMin = Math.round(kma.daily.temperature_2m_min[2]);
        const tomorrowMax = Math.round(kma.daily.temperature_2m_max[2]);
        const tomorrowRain = base.daily.precipitation_probability_max[2] || 0;
        const tomorrowWeather = getWeatherDesc(kma.daily.weather_code[2], tomorrowRain);

        mainBriefingEl.innerText = `일과 이후 현재 기온은 ${kmaTemp}°C이며, 오늘 밤은 ${afterRainHours.length > 0 ? '비 소식이 있으니 우산을 챙기세요.' : `비 소식 없이 ${kmaWeather.desc} 밤 날씨가 이어집니다.`}`;
        subBriefingEl.innerText = `${diffText} 내일은 ${tomorrowWeather.desc} 날씨 속에 아침 최저 ${tomorrowMin}°C / 낮 최고 ${tomorrowMax}°C가 예상됩니다.`;
      }

      // 뱃지 출력
      if (workRainHours.length > 0 || afterRainHours.length > 0) {
        badgeContainerEl.innerHTML += `<div class="badge badge-rain">☔ 강수 예보 (우산 준비!)</div>`;
      } else {
        badgeContainerEl.innerHTML += `<div class="badge badge-safe">✨ 일과·퇴근길 비 없음</div>`;
      }
      badgeContainerEl.innerHTML += `<div class="badge badge-temp">어제보다 ${diffAbs}°C ${tempDiff >= 0 ? '높음' : '낮음'}</div>`;
      badgeContainerEl.innerHTML += `<div class="badge badge-temp">일과·저녁 기온차 ${dayNightGap}°C</div>`;

      // 상단 2분할 카드 반영
      document.getElementById('kmaIcon').innerText = kmaWeather.icon;
      document.getElementById('kmaTemp').innerText = `${kmaTemp}°`;
      document.getElementById('kmaStatus').innerText = kmaWeather.text;
      document.getElementById('kmaRain').innerText = `${kmaCurrentRainProb}%`;
      document.getElementById('kmaHumidity').innerText = `${kmaHum}%`;

      document.getElementById('accuIcon').innerText = accuWeather.icon;
      document.getElementById('accuTemp').innerText = `${accuTemp}°`;
      document.getElementById('accuStatus').innerText = accuWeather.text;
      document.getElementById('accuRain').innerText = `${accuCurrentRainProb}%`;
      document.getElementById('accuHumidity').innerText = `${accuHum}%`;
    }

    function switchModel(model) {
      currentModel = model;
      if (model === 'kma') {
        document.getElementById('tabKma').classList.add('active');
        document.getElementById('tabAccu').classList.remove('active');
      } else {
        document.getElementById('tabAccu').classList.add('active');
        document.getElementById('tabKma').classList.remove('active');
      }
      renderWeeklyForecast(model);
    }

    function renderWeeklyForecast(model) {
      const container = document.getElementById('weeklyForecast');
      container.innerHTML = '';
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

      if (model === 'kma' && globalDataKMA && globalDataBase) {
        for (let i = 1; i <= 7; i++) {
          const dateObj = new Date(globalDataKMA.daily.time[i]);
          const dayName = dayNames[dateObj.getDay()];
          const label = i === 1 ? '오늘' : `${dateObj.getMonth() + 1}/${dateObj.getDate()} (${dayName})`;
          const rawRain = globalDataBase.daily.precipitation_probability_max[i] || 0;
          const rain = roundRainProb(rawRain);
          const wCode = globalDataKMA.daily.weather_code[i];
          const weather = getWeatherDesc(wCode, rain);
          const maxT = Math.round(globalDataKMA.daily.temperature_2m_max[i]);
          const minT = Math.round(globalDataKMA.daily.temperature_2m_min[i]);

          container.innerHTML += `
            <div class="weekly-row">
              <div class="day-col ${i === 1 ? 'today' : ''}">${label}</div>
              <div class="icon-col">${weather.icon}</div>
              <div class="rain-col">${rain > 0 ? rain + '%' : '0%'}</div>
              <div class="temp-range-col"><span class="min-temp">${minT}°</span> / <strong>${maxT}°</strong></div>
            </div>
          `;
        }
      } else if (model === 'accu' && globalDataAccu) {
        for (let i = 0; i < 7; i++) {
          const dateObj = new Date(globalDataAccu.daily.time[i]);
          const dayName = dayNames[dateObj.getDay()];
          const label = i === 0 ? '오늘' : `${dateObj.getMonth() + 1}/${dateObj.getDate()} (${dayName})`;
          const rain = (globalDataAccu.daily.precipitation_probability_max && globalDataAccu.daily.precipitation_probability_max[i] != null) 
                       ? globalDataAccu.daily.precipitation_probability_max[i] 
                       : 0;
          const wCode = globalDataAccu.daily.weather_code[i];
          const weather = getWeatherDesc(wCode, rain);
          const maxT = Math.round(globalDataAccu.daily.temperature_2m_max[i]);
          const minT = Math.round(globalDataAccu.daily.temperature_2m_min[i]);

          container.innerHTML += `
            <div class="weekly-row">
              <div class="day-col ${i === 0 ? 'today' : ''}">${label}</div>
              <div class="icon-col">${weather.icon}</div>
              <div class="rain-col">${rain > 0 ? rain + '%' : '0%'}</div>
              <div class="temp-range-col"><span class="min-temp">${minT}°</span> / <strong>${maxT}°</strong></div>
            </div>
          `;
        }
      }
    }

    fetchWeatherData();
  </script>
</body>
</html>
