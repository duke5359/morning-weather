<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실시간 맞춤 날씨 브리핑</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231976d2'/><circle cx='38' cy='38' r='18' fill='%23ffb300'/><path d='M30 65 a18 18 0 0 1 36 0 z' fill='%23ffffff'/><circle cx='62' cy='56' r='14' fill='%23e0e0e0'/></svg>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-orange: #fb923c;
      --accent-yellow: #facc15;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 18px; line-height: 1.5; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .title-group h1 { font-size: 1.25rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    .title-group .location { font-size: 0.85rem; color: var(--text-sub); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .refresh-btn { background: #334155; border: none; color: #cbd5e1; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
    
    /* 브리핑 카드 */
    .briefing-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid #38bdf844;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .briefing-tag { font-size: 0.72rem; font-weight: 800; color: var(--accent-blue); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
    .briefing-text { font-size: 1.05rem; font-weight: 700; line-height: 1.45; word-break: keep-all; margin-bottom: 8px; }
    .briefing-sub { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 10px; word-break: keep-all; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .badge-rain { background: #1e3a8a; color: #93c5fd; }
    .badge-temp { background: #374151; color: #f3f4f6; }

    /* 비교 2분할 카드 */
    .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .agency-card { background: var(--card-bg); border-radius: 14px; padding: 14px 12px; text-align: center; border: 1px solid var(--card-border); }
    .agency-card.kma { border-top: 3px solid var(--accent-blue); }
    .agency-card.accu { border-top: 3px solid var(--accent-orange); }
    .agency-name { font-size: 0.78rem; font-weight: 700; margin-bottom: 8px; color: var(--text-sub); }
    .weather-icon { font-size: 2.2rem; margin: 4px 0; }
    .current-temp { font-size: 1.6rem; font-weight: 800; }
    .weather-status { font-size: 0.85rem; color: #cbd5e1; margin-top: 2px; }
    .card-meta { margin-top: 10px; font-size: 0.75rem; color: var(--text-sub); border-top: 1px solid #334155; padding-top: 6px; line-height: 1.35; }

    /* 상세 테이블 */
    .section-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; color: #cbd5e1; }
    .forecast-box { background: var(--card-bg); border-radius: 14px; padding: 12px; border: 1px solid var(--card-border); }
    .forecast-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2d3748; font-size: 0.85rem; }
    .forecast-row:last-child { border-bottom: none; }
    .time-slot { color: var(--text-sub); width: 80px; }
    .time-icon { font-size: 1.1rem; width: 30px; text-align: center; }
    .time-rain { width: 70px; text-align: right; color: #60a5fa; font-weight: 600; font-size: 0.8rem; }
    .time-temp { width: 50px; text-align: right; font-weight: 700; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-group">
      <h1 id="pageTitle">날씨 브리핑</h1>
      <div class="location">📍 서울 (실시간 자동분석)</div>
    </div>
    <button class="refresh-btn" onclick="fetchWeatherData()">새로고침</button>
  </div>

  <!-- 시간 맞춤형 스마트 브리핑 -->
  <div class="briefing-card">
    <div class="briefing-tag" id="briefingTag">TODAY'S BRIEFING</div>
    <div class="briefing-text" id="mainBriefing">날씨 정보를 실시간으로 계산하고 있습니다...</div>
    <div class="briefing-sub" id="subBriefing">잠시만 기다려주세요.</div>
    <div class="badges" id="badgeContainer"></div>
  </div>

  <!-- 기상청 / 아큐웨더 모델 2분할 비교 -->
  <div class="comparison-grid">
    <div class="agency-card kma">
      <div class="agency-name">대한민국 기상청 모델</div>
      <div class="weather-icon" id="kmaIcon">☀️</div>
      <div class="current-temp" id="kmaTemp">--°</div>
      <div class="weather-status" id="kmaStatus">불러오는 중</div>
      <div class="card-meta">
        강수확률: <span id="kmaRain">--%</span><br>
        습도: <span id="kmaHumidity">--%</span>
      </div>
    </div>
    <div class="agency-card accu">
      <div class="agency-name">글로벌 모델 (ECMWF)</div>
      <div class="weather-icon" id="accuIcon">☀️</div>
      <div class="current-temp" id="accuTemp">--°</div>
      <div class="weather-status" id="accuStatus">불러오는 중</div>
      <div class="card-meta">
        강수확률: <span id="accuRain">--%</span><br>
        체감온도: <span id="accuFeels">--°</span>
      </div>
    </div>
  </div>

  <!-- 시간대별 기온/강수 변화 -->
  <div class="section-title">🕒 주요 시간대 예보</div>
  <div class="forecast-box" id="hourlyForecast">
    <!-- 자바스크립트로 동적 렌더링 -->
  </div>

  <script>
    // 날씨 아이콘 매핑
    function getWeatherDesc(code) {
      if (code === 0) return { icon: '☀️', text: '맑음' };
      if ([1, 2].includes(code)) return { icon: '🌤️', text: '대체로 맑음' };
      if (code === 3) return { icon: '☁️', text: '흐림' };
      if ([45, 48].includes(code)) return { icon: '🌫️', text: '안개' };
      if ([51, 53, 55, 61, 63, 65].includes(code)) return { icon: '🌧️', text: '비' };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: '❄️', text: '눈' };
      if ([80, 81, 82].includes(code)) return { icon: '🌦️', text: '소나기' };
      if ([95, 96, 99].includes(code)) return { icon: '⛈️', text: '뇌우' };
      return { icon: '🌤️', text: '구름 조금' };
    }

    async function fetchWeatherData() {
      try {
        // 서울 좌표 (위도 37.5665, 경도 126.9780)
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code&hourly=temperature_2m,precipitation_probability,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FSeoul&past_days=1';
        const res = await fetch(url);
        const data = await res.json();

        updateUI(data);
      } catch (err) {
        document.getElementById('mainBriefing').innerText = '날씨 데이터를 불러오지 못했습니다. 네트워크 상태를 확인해주세요.';
      }
    }

    function updateUI(data) {
      const now = new Date();
      const currentHour = now.getHours();

      // 현재 및 과거/일일 기온 데이터
      const currentTemp = Math.round(data.current.temperature_2m);
      const currentApparent = Math.round(data.current.apparent_temperature);
      const currentHumidity = data.current.relative_humidity_2m;
      const weatherInfo = getWeatherDesc(data.current.weather_code);

      // 어제 같은 시간 기온 비교 (past_days=1 기준 24시간 전)
      const yesterdayTemp = Math.round(data.hourly.temperature_2m[currentHour]);
      const tempDiff = currentTemp - yesterdayTemp;

      // 오늘 최고/최저 기온
      const todayMax = Math.round(data.daily.temperature_2m_max[1]);
      const todayMin = Math.round(data.daily.temperature_2m_min[1]);

      // 오늘 남아있는 시간 중 비 예보 여부 확인
      const hourlyRainProb = data.hourly.precipitation_probability.slice(24, 48);
      const rainHours = [];
      for (let h = Math.max(currentHour, 6); h < 24; h++) {
        if (hourlyRainProb[h] >= 40) {
          rainHours.push(h);
        }
      }

      // 오늘 강수 여부 문구 생성
      let rainNotice = '';
      let needUmbrella = false;
      if (rainHours.length > 0) {
        needUmbrella = true;
        const startH = rainHours[0];
        const endH = rainHours[rainHours.length - 1] + 1;
        rainNotice = `${startH}시~${endH}시경 비 예보가 잡혀있습니다. 우산을 꼭 챙기세요!`;
      } else {
        rainNotice = '오늘 비 예보 없이 야외 활동하기 무난한 날씨입니다.';
      }

      // ================= 시간대별 동적 멘트 로직 =================
      const pageTitleEl = document.getElementById('pageTitle');
      const briefingTagEl = document.getElementById('briefingTag');
      const mainBriefingEl = document.getElementById('mainBriefing');
      const subBriefingEl = document.getElementById('subBriefing');
      const badgeContainerEl = document.getElementById('badgeContainer');
      badgeContainerEl.innerHTML = '';

      if (currentHour < 10) {
        // [1] 오전 10시 이전: 출근/등교 중심
        pageTitleEl.innerText = '출근·등교 날씨 브리핑';
        briefingTagEl.innerText = 'MORNING BRIEFING';
        mainBriefingEl.innerText = rainNotice;
        
        let tempComment = `어제보다 ${Math.abs(tempDiff)}°C ${tempDiff >= 0 ? '높습니다.' : '낮습니다.'}`;
        if (currentTemp <= 10) tempComment += ' 아침 공기가 쌀쌀하니 든든한 겉옷을 챙기세요.';
        else tempComment += ' 상쾌한 아침 기온입니다.';
        subBriefingEl.innerText = tempComment;

      } else if (currentHour >= 10 && currentHour < 14) {
        // [2] 오전 10시 ~ 오후 2시: 낮 시간/활동 중심
        pageTitleEl.innerText = '낮 시간대 날씨 브리핑';
        briefingTagEl.innerText = 'AFTERNOON BRIEFING';
        mainBriefingEl.innerText = `오늘 낮 최고 기온은 ${todayMax}°C까지 오르겠습니다.`;
        
        let dayComment = `현재 기온 ${currentTemp}°C (체감 ${currentApparent}°C)입니다.`;
        if (needUmbrella) dayComment += ` 오후 시간대 비 소식이 있으니 이동 시 우산을 확인하세요.`;
        else dayComment += ` 낮 동안 온화하며 활동하기 무난합니다.`;
        subBriefingEl.innerText = dayComment;

      } else if (currentHour >= 14 && currentHour < 17) {
        // [3] 오후 2시 ~ 오후 5시: 현재 및 저녁 날씨 대비
        pageTitleEl.innerText = '오후·퇴근길 날씨 브리핑';
        briefingTagEl.innerText = 'EVENING PREVIEW';
        
        const eveningTemp = Math.round(data.hourly.temperature_2m[24 + 19]); // 오후 7시경 예상 기온
        mainBriefingEl.innerText = `지금 기온은 ${currentTemp}°C이며, 저녁 무렵엔 ${eveningTemp}°C로 내려갑니다.`;
        
        let eveningComment = '';
        if (rainHours.some(h => h >= 17)) {
          eveningComment = '퇴근 시간 및 저녁에 비 예보가 있으니 우산 잊지 마세요.';
        } else {
          eveningComment = '저녁 이후 기온이 빠르게 떨어지니 일교차에 유의하세요.';
        }
        subBriefingEl.innerText = eveningComment;

      } else {
        // [4] 오후 5시 이후 ~ 밤: 퇴근 및 내일 준비
        pageTitleEl.innerText = '저녁·내일 날씨 브리핑';
        briefingTagEl.innerText = 'NIGHT BRIEFING';
        
        const tomorrowMin = Math.round(data.daily.temperature_2m_min[2] || todayMin);
        mainBriefingEl.innerText = `오늘 밤은 ${weatherInfo.text} 날씨가 이어지며 서늘하겠습니다.`;
        subBriefingEl.innerText = `내일 아침 최저 기온은 약 ${tomorrowMin}°C로 예상됩니다. 편안한 저녁 되세요.`;
      }

      // 배지 표시
      if (needUmbrella) {
        badgeContainerEl.innerHTML += `<div class="badge badge-rain">☔ 우산 챙기기 필수</div>`;
      }
      badgeContainerEl.innerHTML += `<div class="badge badge-temp">최고 ${todayMax}° / 최저 ${todayMin}°</div>`;

      // 2개 모델 카드 반영
      document.getElementById('kmaIcon').innerText = weatherInfo.icon;
      document.getElementById('kmaTemp').innerText = `${currentTemp}°`;
      document.getElementById('kmaStatus').innerText = weatherInfo.text;
      document.getElementById('kmaRain').innerText = `${hourlyRainProb[currentHour] || 0}%`;
      document.getElementById('kmaHumidity').innerText = `${currentHumidity}%`;

      document.getElementById('accuIcon').innerText = weatherInfo.icon;
      document.getElementById('accuTemp').innerText = `${currentTemp}°`;
      document.getElementById('accuStatus').innerText = `${weatherInfo.text} (체감 ${currentApparent}°)`;
      document.getElementById('accuRain').innerText = `${hourlyRainProb[currentHour] || 0}%`;
      document.getElementById('accuFeels').innerText = `${currentApparent}°`;

      // 시간대별 테이블 렌더링 (주요 구간 8시, 12시, 15시, 18시, 21시)
      const forecastContainer = document.getElementById('hourlyForecast');
      forecastContainer.innerHTML = '';
      const targetHours = [8, 12, 15, 18, 21];

      targetHours.forEach(h => {
        const slotTemp = Math.round(data.hourly.temperature_2m[24 + h]);
        const slotRain = data.hourly.precipitation_probability[24 + h];
        const slotCode = data.hourly.weather_code[24 + h];
        const slotWeather = getWeatherDesc(slotCode);

        let label = `${h}시`;
        if (h === 8) label = '출근 (08시)';
        if (h === 12) label = '점심 (12시)';
        if (h === 18) label = '퇴근 (18시)';

        forecastContainer.innerHTML += `
          <div class="forecast-row">
            <div class="time-slot">${label}</div>
            <div class="time-icon">${slotWeather.icon}</div>
            <div class="time-rain">${slotRain > 0 ? slotRain + '%' : '-'}</div>
            <div class="time-temp">${slotTemp}°</div>
          </div>
        `;
      });
    }

    // 접속 시 자동 실행
    fetchWeatherData();
  </script>
</body>
</html>
