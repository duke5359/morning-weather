<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>실시간 맞춤 날씨 브리핑</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231976d2'/><circle cx='38' cy='38' r='18' fill='%23ffb300'/><path d='M30 65 a18 18 0 0 1 36 0 z' fill='%23ffffff'/><circle cx='62' cy='56' r='14' fill='%23e0e0e0'/></svg>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-orange: #fb923c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; }
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      padding: max(calc(env(safe-area-inset-top, 24px) + 14px), 48px) 16px 30px 16px; 
      line-height: 1.45; 
    }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .title-group h1 { font-size: 1.2rem; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    
    /* 지역 선택 드롭다운 스타일 */
    .location-wrapper { display: inline-flex; align-items: center; margin-top: 3px; position: relative; }
    .location-select {
      appearance: none;
      -webkit-appearance: none;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 22px 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
    }
    .location-select:focus { border-color: var(--accent-blue); color: #fff; }
    .select-arrow {
      position: absolute;
      right: 7px;
      font-size: 0.65rem;
      color: var(--text-sub);
      pointer-events: none;
    }

    .refresh-btn { background: #334155; border: 1px solid #475569; color: #f1f5f9; padding: 6px 12px; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .refresh-btn:active { background: #475569; transform: scale(0.96); }
    
    /* 심플 브리핑 카드 */
    .briefing-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1px solid #38bdf844;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
    .briefing-tag { font-size: 0.7rem; font-weight: 800; color: var(--accent-blue); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 4px; }
    .briefing-text { font-size: 1.02rem; font-weight: 700; word-break: keep-all; margin-bottom: 5px; color: #fff; }
    .briefing-sub { font-size: 0.86rem; color: #cbd5e1; margin-bottom: 10px; word-break: keep-all; }
    
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge { font-size: 0.73rem; padding: 3px 8px; border-radius: 6px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .badge-rain { background: #4c1d4f; color: #f472b6; border: 1px solid #831843; }
    .badge-safe { background: #064e3b; color: #6ee7b7; border: 1px solid #047857; }
    .badge-temp { background: #334155; color: #f1f5f9; }

    /* 슬림해진 현재 날씨 2분할 비교 카드 */
    .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .agency-card { background: var(--card-bg); border-radius: 12px; padding: 10px 10px; text-align: center; border: 1px solid var(--card-border); }
    .agency-card.kma { border-top: 3px solid var(--accent-blue); }
    .agency-card.accu { border-top: 3px solid var(--accent-orange); }
    .agency-name { font-size: 0.74rem; font-weight: 700; margin-bottom: 4px; color: var(--text-sub); }
    
    .agency-main { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 2px 0; }
    .weather-icon { font-size: 1.65rem; }
    .current-temp { font-size: 1.35rem; font-weight: 800; color: #fff; }
    .weather-status { font-size: 0.78rem; color: #cbd5e1; margin-bottom: 6px; }
    
    .card-meta { font-size: 0.73rem; color: var(--text-sub); border-top: 1px solid #334155; padding-top: 6px; line-height: 1.4; }
    .meta-ampm { color: #e2e8f0; font-weight: 600; }

    /* 네이버 스타일 주간 예보 (오전/오후 분리) */
    .section-title { font-size: 0.92rem; font-weight: 700; margin-bottom: 8px; color: #cbd5e1; }
    .weekly-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .tab-btn { background: #1e293b; border: 1px solid var(--card-border); color: var(--text-sub); padding: 7px; border-radius: 9px; font-size: 0.78rem; font-weight: 700; cursor: pointer; text-align: center; }
    .tab-btn.active.kma-tab { background: #0c4a6e; border-color: var(--accent-blue); color: #fff; }
    .tab-btn.active.accu-tab { background: #7c2d12; border-color: var(--accent-orange); color: #fff; }

    .weekly-box { background: var(--card-bg); border-radius: 14px; padding: 4px 14px; border: 1px solid var(--card-border); }
    .weekly-header { display: flex; justify-content: space-between; align-items: center; padding: 7px 0 5px 0; border-bottom: 1px solid #334155; font-size: 0.7rem; color: var(--text-sub); font-weight: 600; }
    .wh-day { width: 52px; }
    .wh-ampm { flex: 1; display: flex; justify-content: center; gap: 28px; }
    .wh-temp { width: 78px; text-align: right; }

    .weekly-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #2d3748; font-size: 0.84rem; }
    .weekly-row:last-child { border-bottom: none; }
    
    .day-col { width: 52px; line-height: 1.2; }
    .day-title { font-weight: 700; color: #f8fafc; font-size: 0.85rem; }
    .day-title.today { color: var(--accent-blue); }
    .day-title.sun { color: #f87171; }
    .day-date { font-size: 0.7rem; color: var(--text-sub); }

    .ampm-col { flex: 1; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .half-day { display: flex; align-items: center; gap: 4px; width: 62px; }
    .half-day.am { justify-content: flex-end; }
    .half-day.pm { justify-content: flex-start; }
    .rain-prob { font-size: 0.74rem; font-weight: 700; color: #38bdf8; width: 30px; }
    .rain-prob.zero { color: #64748b; font-weight: 500; }
    .am .rain-prob { text-align: right; }
    .pm .rain-prob { text-align: left; }
    .half-icon { font-size: 1.15rem; }

    .temp-range-col { width: 78px; text-align: right; font-weight: 700; font-size: 0.88rem; }
    .min-temp { color: #60a5fa; }
    .temp-slash { color: #475569; font-weight: 400; margin: 0 2px; font-size: 0.78rem; }
    .max-temp { color: #f87171; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-group">
      <h1 id="pageTitle">실시간 날씨 브리핑</h1>
      <div class="location-wrapper">
        <select id="locationSelect" class="location-select" onchange="handleLocationChange()">
          <option value="37.5665,126.9780">📍 서울</option>
          <option value="gps" id="gpsOption">🎯 현재 내 위치 (GPS)</option>
          <option value="37.8949,127.2003">📍 경기 포천</option>
          <option value="37.2983,127.6375">📍 경기 여주</option>
          <option value="37.2636,127.0286">📍 수원·화성</option>
          <option value="37.5340,126.6534">📍 인천 청라</option>
          <option value="37.6891,127.8806">📍 강원 홍천</option>
          <option value="37.7519,128.8760">📍 강원 강릉</option>
          <option value="37.1326,128.1910">📍 충북 제천</option>
          <option value="36.3504,127.3845">📍 대전</option>
          <option value="35.8562,129.2247">📍 경북 경주</option>
          <option value="35.8714,128.6014">📍 대구</option>
          <option value="35.1595,126.8526">📍 광주광역시</option>
          <option value="34.7604,127.6622">📍 전남 여수</option>
          <option value="35.1796,129.0756">📍 부산</option>
          <option value="33.4996,126.5312">📍 제주</option>
        </select>
        <span class="select-arrow">▾</span>
      </div>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="fetchWeatherData(true)">새로고침</button>
  </div>

  <!-- 핵심 브리핑 카드 -->
  <div class="briefing-card">
    <div class="briefing-tag" id="briefingTag">TODAY'S BRIEFING</div>
    <div class="briefing-text" id="mainBriefing">날씨 정보를 불러오는 중입니다...</div>
    <div class="briefing-sub" id="subBriefing">잠시만 기다려주세요.</div>
    <div class="badges" id="badgeContainer"></div>
  </div>

  <!-- 슬림형 2분할 비교 카드 (오전/오후 기온 및 강수확률) -->
  <div class="comparison-grid">
    <div class="agency-card kma">
      <div class="agency-name">대한민국 기상청</div>
      <div class="agency-main">
        <span class="weather-icon" id="kmaIcon">☀️</span>
        <span class="current-temp" id="kmaTemp">--°</span>
      </div>
      <div class="weather-status" id="kmaStatus">불러오는 중</div>
      <div class="card-meta">
        <div class="meta-ampm">오전 <span id="kmaAmTemp">--°</span> / 오후 <span id="kmaPmTemp">--°</span></div>
        <div>강수확률: <span id="kmaRain">--%</span></div>
      </div>
    </div>
    <div class="agency-card accu">
      <div class="agency-name">아큐웨더 (글로벌)</div>
      <div class="agency-main">
        <span class="weather-icon" id="accuIcon">☀️</span>
        <span class="current-temp" id="accuTemp">--°</span>
      </div>
      <div class="weather-status" id="accuStatus">불러오는 중</div>
      <div class="card-meta">
        <div class="meta-ampm">오전 <span id="accuAmTemp">--°</span> / 오후 <span id="accuPmTemp">--°</span></div>
        <div>강수확률: <span id="accuRain">--%</span></div>
      </div>
    </div>
  </div>

  <!-- 네이버 스타일 주간 예보 (오전 / 오후 분리) -->
  <div class="section-title">📅 주간예보 (오전·오후 비교)</div>
  <div class="weekly-tabs">
    <button class="tab-btn active kma-tab" id="tabKma" onclick="switchModel('kma')">기상청(KMA) 예보</button>
    <button class="tab-btn accu-tab" id="tabAccu" onclick="switchModel('accu')">아큐웨더(글로벌) 예보</button>
  </div>
  <div class="weekly-box">
    <div class="weekly-header">
      <div class="wh-day">날짜</div>
      <div class="wh-ampm"><span>오전</span><span>오후</span></div>
      <div class="wh-temp">최저 / 최고</div>
    </div>
    <div id="weeklyForecast"></div>
  </div>

  <script>
    let dataKMA = null;
    let dataAccu = null;
    let currentModel = 'kma';
    let currentLat = 37.5665;
    let currentLon = 126.9780;

    // 지역 변경 핸들러
    function handleLocationChange() {
      const sel = document.getElementById('locationSelect');
      const val = sel.value;

      if (val === 'gps') {
        if (!navigator.geolocation) {
          alert('이 기기에서 위치 기능을 사용할 수 없습니다.');
          sel.value = '37.5665,126.9780';
          return;
        }
        const gpsOpt = document.getElementById('gpsOption');
        gpsOpt.innerText = '🎯 위치 확인 중...';
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            currentLat = pos.coords.latitude.toFixed(4);
            currentLon = pos.coords.longitude.toFixed(4);
            try {
              const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${currentLat}&lon=${currentLon}&accept-language=ko`);
              const geoData = await geoRes.json();
              const addr = geoData.address || {};
              const cityName = addr.city || addr.county || addr.borough || addr.town || addr.province || '현위치';
              gpsOpt.innerText = `🎯 ${cityName} (GPS)`;
            } catch (e) {
              gpsOpt.innerText = '🎯 현위치 (GPS)';
            }
            fetchWeatherData(true);
          },
          (err) => {
            alert('위치 권한이 거부되었거나 신호를 잡을 수 없어 서울 날씨로 표시합니다.');
            gpsOpt.innerText = '🎯 현재 내 위치 (GPS)';
            sel.value = '37.5665,126.9780';
            currentLat = 37.5665;
            currentLon = 126.9780;
            fetchWeatherData(true);
          },
          { timeout: 8000 }
        );
      } else {
        const parts = val.split(',');
        currentLat = parseFloat(parts[0]);
        currentLon = parseFloat(parts[1]);
        fetchWeatherData(true);
      }
    }

    function getWeatherDesc(code, rainProb = null, cloudCover = null) {
      const c = Number(code || 0);
      if (rainProb !== null && rainProb >= 50 && ![71, 73, 75, 77, 85, 86].includes(c)) {
        return { icon: '🌧️', text: '비 예보', desc: '비 소식이 있는', short: '비가 예상되는' };
      }
      if ([0, 1, 2].includes(c)) {
        if ((cloudCover !== null && cloudCover >= 80) || (rainProb !== null && rainProb >= 30)) {
          return { icon: '☁️', text: '흐림', desc: '먹구름이 많고 흐린', short: '구름 많고 흐린' };
        }
      }
      if (c === 0) return { icon: '☀️', text: '맑음', desc: '맑고 화창한', short: '맑고' };
      if (c === 1) return { icon: '🌤️', text: '대체로 맑음', desc: '대체로 맑은', short: '대체로 맑고' };
      if (c === 2) return { icon: '⛅', text: '구름 많음', desc: '구름이 다소 낀', short: '구름 조금 끼고' };
      if (c === 3) return { icon: '☁️', text: '흐림', desc: '구름 많고 흐린', short: '흐리고' };
      if ([45, 48].includes(c)) return { icon: '🌫️', text: '안개', desc: '안개가 낀', short: '안개 낀' };
      if ([51, 53, 55, 61, 63, 65].includes(c)) return { icon: '🌧️', text: '비', desc: '비가 내리는', short: '비가 내리는' };
      if ([71, 73, 75, 77, 85, 86].includes(c)) return { icon: '❄️', text: '눈', desc: '눈이 내리는', short: '눈이 내리는' };
      if ([80, 81, 82].includes(c)) return { icon: '🌦️', text: '소나기', desc: '소나기가 지나는', short: '비나 소나기가 오는' };
      if ([95, 96, 99].includes(c)) return { icon: '⛈️', text: '뇌우', desc: '천둥번개와 비가 오는', short: '천둥번개 치는' };
      return { icon: '☁️', text: '흐림', desc: '구름 많은', short: '흐린' };
    }

    function getMorningFeel(temp) {
      if (temp >= 23) return '다소 더운';
      if (temp >= 15) return '쾌적한';
      if (temp >= 8) return '선선한';
      if (temp >= 1) return '쌀쌀한';
      return '추운';
    }

    function roundRainProb(prob) {
      const p = Number(prob || 0);
      if (p < 10) return 0;
      return Math.round(p / 10) * 10;
    }

    function safeVal(val, fallback = 15) {
      return (val !== null && val !== undefined && !isNaN(val)) ? Math.round(Number(val)) : fallback;
    }

    async function fetchWeatherData(isManual = false) {
      const btn = document.getElementById('refreshBtn');
      if (isManual && btn) btn.innerText = '갱신 중...';

      try {
        const cacheBust = `&_t=${Date.now()}`;
        const urlStandard = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&current=temperature_2m,precipitation,weather_code,cloud_cover&hourly=temperature_2m,precipitation_probability,weather_code,cloud_cover&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&past_days=1&forecast_days=8` + cacheBust;
        const urlGlobal = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&models=gfs_seamless&current=temperature_2m,weather_code,cloud_cover&hourly=temperature_2m,precipitation_probability,weather_code,cloud_cover&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=8` + cacheBust;

        const resStandard = await fetch(urlStandard, { cache: 'no-store' });
        dataKMA = await resStandard.json();

        try {
          const resGlobal = await fetch(urlGlobal, { cache: 'no-store' });
          dataAccu = resGlobal.ok ? await resGlobal.json() : dataKMA;
        } catch (e) {
          dataAccu = dataKMA;
        }

        updateUI(dataKMA, dataAccu);
        renderWeeklyForecast(currentModel);
      } catch (err) {
        document.getElementById('mainBriefing').innerText = '데이터를 불러오지 못했습니다. 새로고침을 눌러주세요.';
      } finally {
        if (btn) {
          setTimeout(() => { btn.innerText = '새로고침'; }, 300);
        }
      }
    }

    function updateUI(kma, accu) {
      const now = new Date();
      const currentHour = now.getHours();

      const todayTemps = kma.hourly.temperature_2m.slice(24, 48).map(t => safeVal(t, 15));
      const todayRains = kma.hourly.precipitation_probability.slice(24, 48).map(r => Number(r || 0));
      const todayCodes = kma.hourly.weather_code.slice(24, 48);
      const todayClouds = kma.hourly.cloud_cover ? kma.hourly.cloud_cover.slice(24, 48).map(c => Number(c || 0)) : [];

      const kmaTemp = safeVal(kma.current.temperature_2m, todayTemps[currentHour]);
      const kmaCurrentRainProb = roundRainProb(todayRains[currentHour] || 0);
      const kmaCloud = kma.current.cloud_cover != null ? Number(kma.current.cloud_cover) : (todayClouds[currentHour] || 0);
      
      const effectiveKmaCode = (kma.current.precipitation > 0) ? 61 : kma.current.weather_code;
      const kmaWeather = getWeatherDesc(effectiveKmaCode, kmaCurrentRainProb, kmaCloud);

      const kmaAmTemp = safeVal(todayTemps[9], safeVal(kma.daily.temperature_2m_min[1], 10));
      const kmaPmTemp = safeVal(todayTemps[15], safeVal(kma.daily.temperature_2m_max[1], 20));

      const accuStartIdx = (accu && accu.daily && accu.daily.time.length > 8) ? 24 : 0;
      const accuTodayTemps = (accu && accu.hourly && accu.hourly.temperature_2m) 
        ? accu.hourly.temperature_2m.slice(accuStartIdx, accuStartIdx + 24).map(t => safeVal(t, kmaTemp))
        : todayTemps;

      const accuTemp = (accu && accu.current && accu.current.temperature_2m != null) ? safeVal(accu.current.temperature_2m, kmaTemp) : kmaTemp;
      const accuAmTemp = safeVal(accuTodayTemps[9], kmaAmTemp);
      const accuPmTemp = safeVal(accuTodayTemps[15], kmaPmTemp);
      const accuCurrentRainProb = (accu && accu.hourly && accu.hourly.precipitation_probability) 
        ? Number(accu.hourly.precipitation_probability[accuStartIdx + currentHour] || 0) 
        : (todayRains[currentHour] || 0);
      const accuCloud = (accu && accu.current && accu.current.cloud_cover != null) ? Number(accu.current.cloud_cover) : kmaCloud;
      const accuWeather = (accu && accu.current && accu.current.weather_code != null) 
        ? getWeatherDesc(accu.current.weather_code, accuCurrentRainProb, accuCloud) 
        : kmaWeather;

      const yesterdayTemp = safeVal(kma.hourly.temperature_2m[currentHour], kmaTemp);
      const tempDiff = kmaTemp - yesterdayTemp;
      const diffAbs = Math.abs(tempDiff);
      const diffText = tempDiff === 0 ? '어제와 같고' : `어제보다 ${diffAbs}°C ${tempDiff > 0 ? '높고' : '낮고'}`;

      const todayMax = safeVal(kma.daily.temperature_2m_max[1], Math.max(...todayTemps));
      const morningTemp = todayTemps[8] || kmaAmTemp;
      const eveningTemp = todayTemps[19] || kmaTemp;

      const rainHours = [];
      for (let h = Math.max(currentHour, 6); h < 24; h++) {
        if (todayRains[h] >= 40) rainHours.push(h);
      }
      const hasRain = rainHours.length > 0;
      const rainShort = hasRain ? `${rainHours[0]}시~${rainHours[rainHours.length-1]+1}시경 비 예보가 있으니 우산을 챙기세요.` : `${kmaWeather.desc} 날씨가 이어집니다.`;

      const pageTitleEl = document.getElementById('pageTitle');
      const briefingTagEl = document.getElementById('briefingTag');
      const mainBriefingEl = document.getElementById('mainBriefing');
      const subBriefingEl = document.getElementById('subBriefing');
      const badgeContainerEl = document.getElementById('badgeContainer');
      badgeContainerEl.innerHTML = '';

      if (currentHour < 6) {
        pageTitleEl.innerText = '심야·새벽 날씨 브리핑';
        briefingTagEl.innerText = 'LATE NIGHT BRIEFING';
        mainBriefingEl.innerText = `깊은 밤 현재 ${kmaTemp}°C(${kmaWeather.text})이며, 날이 밝으면 아침 기온은 ${morningTemp}°C가 예상됩니다.`;
        subBriefingEl.innerText = hasRain 
          ? `오늘 낮 최고 ${todayMax}°C까지 오르며, ${rainHours[0]}시~${rainHours[rainHours.length-1]+1}시경 비 예보가 있습니다.` 
          : `현재 ${diffText}, 오늘 낮 최고 기온은 ${todayMax}°C까지 오릅니다.`;

      } else if (currentHour >= 6 && currentHour < 10) {
        pageTitleEl.innerText = '출근·등교 날씨 브리핑';
        briefingTagEl.innerText = 'MORNING BRIEFING';
        if (hasRain) {
          mainBriefingEl.innerText = `☔ 우산이 필요한 출근·등교길입니다. ${rainHours[0]}시~${rainHours[rainHours.length-1]+1}시경 비 예보가 있습니다.`;
        } else {
          mainBriefingEl.innerText = `${kmaWeather.short} ${getMorningFeel(kmaTemp)} 출근·등교길입니다. 오늘 비 소식 없이 무난합니다.`;
        }
        subBriefingEl.innerText = `현재 ${kmaTemp}°C로 ${diffText}, 낮 최고 ${todayMax}°C까지 오릅니다.`;

      } else if (currentHour >= 10 && currentHour < 14) {
        pageTitleEl.innerText = '낮 시간대 날씨 브리핑';
        briefingTagEl.innerText = 'DAYTIME BRIEFING';
        mainBriefingEl.innerText = `오늘 한낮 최고 ${todayMax}°C이며, ${rainShort}`;
        subBriefingEl.innerText = `현재 ${kmaTemp}°C로 ${diffText}, 저녁 무렵엔 ${eveningTemp}°C로 선선해집니다.`;

      } else if (currentHour >= 14 && currentHour < 17) {
        pageTitleEl.innerText = '오후·저녁 날씨 브리핑';
        briefingTagEl.innerText = 'AFTERNOON & EVENING';
        const eveWeather = getWeatherDesc(todayCodes[19], todayRains[19], todayClouds[19]);
        mainBriefingEl.innerText = `지금은 ${kmaTemp}°C(${kmaWeather.text})이며, 저녁엔 ${eveWeather.text}(${eveningTemp}°C) 날씨가 예상됩니다.`;
        subBriefingEl.innerText = `현재 ${diffText}, 퇴근길 기온이 내려가니 가벼운 겉옷을 챙기세요.`;

      } else {
        pageTitleEl.innerText = '저녁·내일 날씨 브리핑';
        briefingTagEl.innerText = 'EVENING & TOMORROW';
        const tomorrowMin = safeVal(kma.daily.temperature_2m_min[2], 10);
        const tomorrowMax = safeVal(kma.daily.temperature_2m_max[2], 20);
        mainBriefingEl.innerText = `현재 ${kmaTemp}°C로 ${rainShort}`;
        subBriefingEl.innerText = `어제 이 시간보다 ${diffAbs}°C ${tempDiff >= 0 ? '높습니다.' : '낮습니다.'} 내일은 ${tomorrowMin}°~${tomorrowMax}°가 예상됩니다.`;
      }

      if (hasRain) {
        badgeContainerEl.innerHTML += `<div class="badge badge-rain">☔ 오늘 비 예보 (우산 필수)</div>`;
      } else {
        badgeContainerEl.innerHTML += `<div class="badge badge-safe">☀️ 비 소식 없음</div>`;
      }
      badgeContainerEl.innerHTML += `<div class="badge badge-temp">어제보다 ${diffAbs}°C ${tempDiff >= 0 ? '높음' : '낮음'}</div>`;

      document.getElementById('kmaIcon').innerText = kmaWeather.icon;
      document.getElementById('kmaTemp').innerText = `${kmaTemp}°`;
      document.getElementById('kmaStatus').innerText = kmaWeather.text;
      document.getElementById('kmaAmTemp').innerText = `${kmaAmTemp}°`;
      document.getElementById('kmaPmTemp').innerText = `${kmaPmTemp}°`;
      document.getElementById('kmaRain').innerText = `${kmaCurrentRainProb}%`;

      document.getElementById('accuIcon').innerText = accuWeather.icon;
      document.getElementById('accuTemp').innerText = `${accuTemp}°`;
      document.getElementById('accuStatus').innerText = accuWeather.text;
      document.getElementById('accuAmTemp').innerText = `${accuAmTemp}°`;
      document.getElementById('accuPmTemp').innerText = `${accuPmTemp}°`;
      document.getElementById('accuRain').innerText = `${accuCurrentRainProb}%`;
    }

    function switchModel(model) {
      currentModel = model;
      document.getElementById('tabKma').classList.toggle('active', model === 'kma');
      document.getElementById('tabAccu').classList.toggle('active', model === 'accu');
      renderWeeklyForecast(model);
    }

    function getAmPmData(hourlyRain, hourlyCode, hourlyCloud, dayOffset, isKma) {
      const baseHour = dayOffset * 24;
      const amRains = hourlyRain.slice(baseHour + 6, baseHour + 12).map(r => Number(r || 0));
      const pmRains = hourlyRain.slice(baseHour + 12, baseHour + 21).map(r => Number(r || 0));

      let amMaxRain = amRains.length ? Math.max(...amRains) : 0;
      let pmMaxRain = pmRains.length ? Math.max(...pmRains) : 0;

      if (isKma) {
        amMaxRain = roundRainProb(amMaxRain);
        pmMaxRain = roundRainProb(pmMaxRain);
      } else {
        amMaxRain = Math.round(amMaxRain);
        pmMaxRain = Math.round(pmMaxRain);
      }

      const amCode = hourlyCode[baseHour + 9] != null ? hourlyCode[baseHour + 9] : 0;
      const pmCode = hourlyCode[baseHour + 15] != null ? hourlyCode[baseHour + 15] : 0;
      const amCloud = hourlyCloud[baseHour + 9] != null ? hourlyCloud[baseHour + 9] : null;
      const pmCloud = hourlyCloud[baseHour + 15] != null ? hourlyCloud[baseHour + 15] : null;

      const amWeather = getWeatherDesc(amCode, amMaxRain, amCloud);
      const pmWeather = getWeatherDesc(pmCode, pmMaxRain, pmCloud);

      return { amRain: amMaxRain, amIcon: amWeather.icon, pmRain: pmMaxRain, pmIcon: pmWeather.icon };
    }

    function renderWeeklyForecast(model) {
      const container = document.getElementById('weeklyForecast');
      container.innerHTML = '';
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];

      const targetData = (model === 'kma') ? dataKMA : dataAccu;
      if (!targetData || !targetData.daily) return;

      const isKma = (model === 'kma');
      const startIdx = targetData.daily.time.length > 8 ? 1 : 0;

      for (let i = startIdx; i < startIdx + 7; i++) {
        if (!targetData.daily.time[i]) continue;
        const dateObj = new Date(targetData.daily.time[i]);
        const dayIdx = dateObj.getDay();
        const dayName = dayNames[dayIdx];
        const dateStr = `${dateObj.getMonth() + 1}.${dateObj.getDate()}.`;

        let titleLabel = dayName;
        if (i === startIdx) titleLabel = '오늘';
        else if (i === startIdx + 1) titleLabel = '내일';

        const titleClass = i === startIdx ? 'today' : (dayIdx === 0 ? 'sun' : '');

        const ampm = getAmPmData(
          targetData.hourly.precipitation_probability || [],
          targetData.hourly.weather_code || [],
          targetData.hourly.cloud_cover || [],
          i,
          isKma
        );

        const maxT = safeVal(targetData.daily.temperature_2m_max[i], 20);
        const minT = safeVal(targetData.daily.temperature_2m_min[i], 10);

        container.innerHTML += `
          <div class="weekly-row">
            <div class="day-col">
              <div class="day-title ${titleClass}">${titleLabel}</div>
              <div class="day-date">${dateStr}</div>
            </div>
            <div class="ampm-col">
              <div class="half-day am">
                <span class="rain-prob ${ampm.amRain === 0 ? 'zero' : ''}">${ampm.amRain}%</span>
                <span class="half-icon">${ampm.amIcon}</span>
              </div>
              <div class="half-day pm">
                <span class="half-icon">${ampm.pmIcon}</span>
                <span class="rain-prob ${ampm.pmRain === 0 ? 'zero' : ''}">${ampm.pmRain}%</span>
              </div>
            </div>
            <div class="temp-range-col">
              <span class="min-temp">${minT}°</span><span class="temp-slash">/</span><span class="max-temp">${maxT}°</span>
            </div>
          </div>
        `;
      }
    }

    fetchWeatherData();
  </script>
</body>
</html>
