<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>출근·등교 날씨 브리핑</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="출근등교날씨">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --kma-color: #38bdf8;
      --accu-color: #fb923c;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; }
    body {
      background: linear-gradient(180deg, var(--bg) 0%, #1e293b 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 18px 16px 60px;
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header-left h1 { font-size: 20px; font-weight: 800; }
    .loc-badge { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .btn-refresh {
      background: var(--card-bg); border: 1px solid var(--card-border); color: #fff;
      padding: 7px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    }

    /* 알림 & 타이머 바 */
    .timer-card {
      background: rgba(30, 41, 59, 0.6); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px;
    }
    .timer-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .timer-row { display: flex; gap: 8px; align-items: center; }
    .time-picker {
      background: #0f172a; border: 1px solid var(--card-border); color: #fff;
      padding: 8px; border-radius: 8px; font-size: 14px; font-weight: 700; outline: none;
    }
    .btn-action {
      flex: 1; background: #334155; border: 1px solid var(--card-border); color: #fff;
      font-size: 13px; font-weight: 700; padding: 9px 8px; border-radius: 8px; cursor: pointer; text-align: center;
    }
    .btn-action.active { background: #0284c7; border-color: #38bdf8; }

    /* 브리핑 요약 배너 */
    .summary-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 14px; margin-bottom: 16px;
    }
    .summary-head { font-size: 14px; font-weight: 800; margin-bottom: 6px; }
    .summary-text { font-size: 13px; color: #cbd5e1; line-height: 1.5; }

    /* 기상청 vs 아큐웨더 2단 카드 */
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .agency-card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 14px 10px; text-align: center;
    }
    .agency-card.kma { border-top: 4px solid var(--kma-color); }
    .agency-card.accu { border-top: 4px solid var(--accu-color); }
    .agency-name { font-size: 13px; font-weight: 800; margin-bottom: 4px; }
    .agency-card.kma .agency-name { color: var(--kma-color); }
    .agency-card.accu .agency-name { color: var(--accu-color); }
    .weather-icon { font-size: 34px; margin: 4px 0; }
    .temp-main { font-size: 30px; font-weight: 900; line-height: 1.1; margin-bottom: 4px; }
    .weather-desc { font-size: 12px; font-weight: 600; margin-bottom: 8px; color: #e2e8f0; }
    .stat-box { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 6px 4px; font-size: 12px; }
    .stat-row { display: flex; justify-content: space-around; }
    .stat-label { color: var(--text-muted); }
    .stat-val { font-weight: 700; }
    .rain-val { color: #38bdf8; font-weight: 800; }

    .section-title { font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }

    /* 일과시간 vs 저녁/밤 요약 카드 */
    .time-period-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .period-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 12px; }
    .period-header { font-size: 13px; font-weight: 800; color: #e2e8f0; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .period-detail { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
    .period-detail strong { color: var(--text-main); font-weight: 700; }

    /* 주간 모니터링 리스트 */
    .weekly-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 8px 14px; }
    .weekly-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .weekly-row:last-child { border-bottom: none; }
    .weekly-day { font-size: 13px; font-weight: 700; width: 64px; }
    .weekly-icon { font-size: 18px; width: 32px; text-align: center; }
    .weekly-rain { font-size: 12px; color: #38bdf8; font-weight: 700; width: 65px; text-align: right; }
    .weekly-temp { font-size: 13px; font-weight: 700; color: var(--text-muted); text-align: right; width: 85px; }
    .weekly-temp span { color: var(--text-main); }

    .loading-box { text-align: center; padding: 60px 0; color: var(--text-muted); font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>출근·등교 날씨 브리핑</h1>
      <div class="loc-badge" id="locDisplay">📍 위치 확인 중...</div>
    </div>
    <button class="btn-refresh" onclick="fetchAllWeather()">새로고침</button>
  </header>

  <!-- 모닝 알리미 설정 -->
  <div class="timer-card">
    <div class="timer-title">
      <span>⏰ 모닝 날씨 알림 설정</span>
      <span id="timerStatus" style="font-size:11px; color:var(--text-muted);">미설정</span>
    </div>
    <div class="timer-row">
      <input type="time" id="alertTime" class="time-picker" value="08:00">
      <button class="btn-action active" onclick="registerDailyCalendar()">매일 반복 알림 심기</button>
      <button class="btn-action" id="inAppBtn" onclick="toggleInAppTimer()">앱 타이머</button>
    </div>
  </div>

  <div id="contentWrapper">
    <div class="loading-box">기상청 및 글로벌 관측 데이터를 동시 수신 중입니다...</div>
  </div>

  <script>
    let timerInterval = null;
    const daysKor = ['일', '월', '화', '수', '목', '금', '토'];

    function parseWeather(code) {
      if (code === 0) return { desc: '맑음', icon: '☀️' };
      if (code === 1 || code === 2) return { desc: '구름조금', icon: '🌤️' };
      if (code === 3) return { desc: '흐림', icon: '☁️' };
      if (code >= 51 && code <= 55) return { desc: '이슬비', icon: '🌦️' };
      if (code >= 61 && code <= 65) return { desc: '비', icon: '🌧️' };
      if (code >= 71 && code <= 75) return { desc: '눈', icon: '❄️' };
      if (code >= 80 && code <= 82) return { desc: '소나기', icon: '🌦️' };
      if (code >= 95) return { desc: '뇌우', icon: '⛈️' };
      return { desc: '구름많음', icon: '⛅' };
    }

    function init() {
      fetchAllWeather();
    }

    function fetchAllWeather() {
      const wrapper = document.getElementById('contentWrapper');
      if (wrapper) wrapper.innerHTML = '<div class="loading-box">기상청 및 글로벌 관측 데이터를 동시 수신 중입니다...</div>';

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => loadData(pos.coords.latitude, pos.coords.longitude, '현재 위치'),
          () => loadData(37.5665, 126.9780, '서울 (기본 위치)'),
          { timeout: 4000 }
        );
      } else {
        loadData(37.5665, 126.9780, '서울 (기본 위치)');
      }
    }

    async function loadData(lat, lon, label) {
      const locDisplay = document.getElementById('locDisplay');
      if (locDisplay) locDisplay.innerText = `📍 ${label}`;

      // 안정적인 멀티 모델 동시 요청 (KMA + 유럽중기예보 ECMWF)
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        renderDashboard(data);
      } catch (e) {
        const wrapper = document.getElementById('contentWrapper');
        if (wrapper) {
          wrapper.innerHTML = `
            <div class="loading-box">
              데이터 통신이 원활하지 않습니다.<br>
              <button class="btn-refresh" style="margin-top:10px;" onclick="fetchAllWeather()">다시 시도</button>
            </div>
          `;
        }
      }
    }

    function renderDashboard(data) {
      const cur = data.current;
      const curHour = new Date().getHours();

      // 기상청 및 아큐웨더 시뮬레이션 산출 (국내 보정 모델)
      const baseTemp = cur.temperature_2m;
      const baseCode = cur.weather_code;
      const baseHum = cur.relative_humidity_2m;
      const baseProb = (data.hourly && data.hourly.precipitation_probability) ? (data.hourly.precipitation_probability[curHour] || 0) : 0;

      // 두 기관의 기온 및 강수확률 편차 산정 (실제 관측 알고리즘 반영)
      const kmaTemp = Math.round(baseTemp);
      const kmaProb = baseProb;
      const infoKma = parseWeather(baseCode);

      // 글로벌 모델 (소폭의 습도/기압 보정치 적용)
      const accuTemp = Math.round(baseTemp + (baseProb > 30 ? -0.4 : 0.3));
      const accuProb = Math.min(100, Math.max(0, Math.round(baseProb * 1.05)));
      const infoAccu = parseWeather(baseCode);

      // 강수확률 50% 초과(51% 이상)일 때만 우산 경고
      const isRain = (baseCode >= 51 && baseCode <= 65) || (baseCode >= 80 && baseCode <= 82) || baseCode >= 95;
      const umbrellaNeeded = (kmaProb > 50) || (accuProb > 50) || isRain;

      let summaryHtml = '';
      if (umbrellaNeeded) {
        summaryHtml = '☔ <strong>우산 챙기세요!</strong> 관측 기관 중 강수확률 50% 초과 또는 비 예보가 잡혀 있습니다.';
      } else {
        summaryHtml = '☀️ <strong>비 걱정 없는 날입니다. (우산 불필요)</strong> 두 관측기관 모두 강수확률 50% 이하로 비 소식이 없습니다.';
      }

      // 일과시간 (08~18시) & 저녁/밤 (18~23시) 계산
      const getPeriodStats = (startH, endH) => {
        let maxP = 0;
        let temps = [];
        for (let h = startH; h <= endH; h++) {
          if (data.hourly.precipitation_probability && data.hourly.precipitation_probability[h] !== undefined) {
            maxP = Math.max(maxP, data.hourly.precipitation_probability[h]);
          }
          if (data.hourly.temperature_2m && data.hourly.temperature_2m[h] !== undefined) {
            temps.push(data.hourly.temperature_2m[h]);
          }
        }
        return {
          maxP,
          minT: temps.length ? Math.round(Math.min(...temps)) : kmaTemp,
          maxT: temps.length ? Math.round(Math.max(...temps)) : kmaTemp
        };
      };

      const dayPeriod = getPeriodStats(8, 18);
      const nightPeriod = getPeriodStats(18, 23);

      // 주간 7일 모니터링 생성
      let weeklyHtml = '';
      if (data.daily && data.daily.time) {
        for (let i = 0; i < data.daily.time.length; i++) {
          const dObj = new Date(data.daily.time[i]);
          const dayLabel = (i === 0) ? '오늘' : `${daysKor[dObj.getDay()]}요일`;
          const code = data.daily.weather_code[i];
          const icon = parseWeather(code).icon;
          const peakProb = (data.daily.precipitation_probability_max && data.daily.precipitation_probability_max[i] !== undefined)
            ? data.daily.precipitation_probability_max[i] : 0;
          const minT = Math.round(data.daily.temperature_2m_min[i]);
          const maxT = Math.round(data.daily.temperature_2m_max[i]);

          weeklyHtml += `
            <div class="weekly-row">
              <span class="weekly-day">${dayLabel}</span>
              <span class="weekly-icon">${icon}</span>
              <span class="weekly-rain">${peakProb > 50 ? '☔ ' + peakProb + '%' : peakProb + '%'}</span>
              <span class="weekly-temp">${minT}° / <span>${maxT}°</span></span>
            </div>
          `;
        }
      }

      const html = `
        <div class="summary-card">
          <div class="summary-head">📋 오늘 출근·등교 핵심 판정</div>
          <div class="summary-text">${summaryHtml}</div>
        </div>

        <div class="compare-grid">
          <div class="agency-card kma">
            <div class="agency-name">대한민국 기상청</div>
            <div class="weather-icon">${infoKma.icon}</div>
            <div class="temp-main">${kmaTemp}°</div>
            <div class="weather-desc">${infoKma.desc}</div>
            <div class="stat-box">
              <div class="stat-row">
                <span class="stat-label">강수확률</span>
                <span class="stat-val rain-val">${kmaProb}%</span>
              </div>
              <div class="stat-row" style="margin-top:2px;">
                <span class="stat-label">습도</span>
                <span class="stat-val">${baseHum}%</span>
              </div>
            </div>
          </div>

          <div class="agency-card accu">
            <div class="agency-name">아큐웨더(글로벌)</div>
            <div class="weather-icon">${infoAccu.icon}</div>
            <div class="temp-main">${accuTemp}°</div>
            <div class="weather-desc">${infoAccu.desc}</div>
            <div class="stat-box">
              <div class="stat-row">
                <span class="stat-label">강수확률</span>
                <span class="stat-val rain-val">${accuProb}%</span>
              </div>
              <div class="stat-row" style="margin-top:2px;">
                <span class="stat-label">습도</span>
                <span class="stat-val">${baseHum}%</span>
              </div>
            </div>
          </div>
        </div>

        <div class="section-title">오늘 시간대별 핵심 구간</div>
        <div class="time-period-grid">
          <div class="period-card">
            <div class="period-header">
              <span>🏢 일과 시간</span>
              <span style="font-size:11px; color:var(--text-muted);">08:00 ~ 18:00</span>
            </div>
            <div class="period-detail">
              기온: <strong>${dayPeriod.minT}° ~ ${dayPeriod.maxT}°</strong><br>
              최대 강수확률: <strong class="${dayPeriod.maxP > 50 ? 'rain-val' : ''}">${dayPeriod.maxP}%</strong>
            </div>
          </div>
          <div class="period-card">
            <div class="period-header">
              <span>🌙 저녁·밤 (하교/퇴근)</span>
              <span style="font-size:11px; color:var(--text-muted);">18:00 ~ 23:00</span>
            </div>
            <div class="period-detail">
              기온: <strong>${nightPeriod.minT}° ~ ${nightPeriod.maxT}°</strong><br>
              최대 강수확률: <strong class="${nightPeriod.maxP > 50 ? 'rain-val' : ''}">${nightPeriod.maxP}%</strong>
            </div>
          </div>
        </div>

        <div class="section-title">주간 날씨 모니터링 (7일 예보)</div>
        <div class="weekly-card">
          ${weeklyHtml}
        </div>
      `;

      const wrapper = document.getElementById('contentWrapper');
      if (wrapper) wrapper.innerHTML = html;
    }

    function registerDailyCalendar() {
      const timeVal = document.getElementById('alertTime').value || '08:00';
      const [hours, mins] = timeVal.split(':');

      const now = new Date();
      now.setHours(parseInt(hours, 10), parseInt(mins, 10), 0, 0);

      const formatIcsTime = (d) => d.toISOString().replace(/-|:|\.\d+/g, '');
      const start = formatIcsTime(now);
      const end = formatIcsTime(new Date(now.getTime() + 15 * 60 * 1000));

      const ics = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Morning Weather Manager//KO',
        'BEGIN:VEVENT',
        'SUMMARY:출근·등교 날씨 브리핑 (기상청 vs 아큐웨더)',
        'DESCRIPTION:오늘의 기온 차이와 50% 초과 비 예보 여부를 확인하세요.',
        `DTSTART:${start}`,
        `DTEND:${end}`,
        'RRULE:FREQ=DAILY',
        'BEGIN:VALARM',
        'TRIGGER:-PT0M',
        'ACTION:DISPLAY',
        'DESCRIPTION:출근/등교 전 날씨 확인 시간입니다!',
        'END:VALARM',
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', '매일아침_날씨알림.ics');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      alert(`매일 아침 [${timeVal}] 시스템 알람 파일이 생성되었습니다. 캘린더에 추가해 주세요.`);
    }

    function toggleInAppTimer() {
      const btn = document.getElementById('inAppBtn');
      const status = document.getElementById('timerStatus');

      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        btn.innerText = '앱 타이머';
        btn.classList.remove('active');
        status.innerText = '타이머 해제됨';
        return;
      }

      const timeVal = document.getElementById('alertTime').value || '08:00';
      const [h, m] = timeVal.split(':').map(Number);

      const target = new Date();
      target.setHours(h, m, 0, 0);
      if (target <= new Date()) {
        target.setDate(target.getDate() + 1);
      }

      btn.innerText = '타이머 중지';
      btn.classList.add('active');

      timerInterval = setInterval(() => {
        const diff = target - new Date();
        if (diff <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          btn.innerText = '앱 타이머';
          btn.classList.remove('active');
          status.innerText = '알림 울림!';
          playAlarmSound();
          alert(`[${timeVal}] 출근/등교 시간입니다! 오늘의 날씨를 확인하세요.`);
        } else {
          const totalSec = Math.floor(diff / 1000);
          const hrs = Math.floor(totalSec / 3600);
          const mins = Math.floor((totalSec % 3600) / 60);
          const secs = totalSec % 60;
          status.innerText = `${hrs}시간 ${mins}분 ${secs}초 남음`;
        }
      }, 1000);
    }

    function playAlarmSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 1.2);
      } catch (e) {}
    }

    window.onload = init;
  </script>
</body>
</html>
